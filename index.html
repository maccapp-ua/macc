<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MACC — Management Accounting</title>
<style>
:root{
  --bg:#0f1621;--bg2:#151d2b;--bg3:#1a2336;--card:#1e2a3a;--card2:#243044;
  --border:#2a3a52;--border2:#334d6e;
  --text:#e8edf5;--text2:#a0afc0;--text3:#5a7090;
  --accent:#f0b429;--green:#4ade80;--red:#f87171;--amber:#fbbf24;
  --blue:#38bdf8;--violet:#a974e6;--radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* ── NAV ── */
.topbar{display:flex;align-items:center;height:52px;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;gap:0;position:sticky;top:0;z-index:100;overflow-x:auto}
.logo{font-size:17px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-right:24px;white-space:nowrap}
.logo span{font-size:10px;font-weight:400;color:var(--text3);display:block;letter-spacing:.05em;margin-top:-2px}
.nav-item{padding:0 14px;height:52px;display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.nav-item:hover{color:var(--text)}.nav-item.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── LAYOUT ── */
.main{padding:20px 16px;max-width:1400px;margin:0 auto}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-title{font-size:18px;font-weight:700;color:var(--text)}

/* ── CARDS ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-title{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.card-body{padding:16px}

/* ── METRICS ── */
.metrics{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;min-width:140px;flex:1;border-top:3px solid var(--mc,var(--accent))}
.metric-label{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.metric-value{font-size:18px;font-weight:700;color:var(--text)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:.15s}
.btn:hover{color:var(--text);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#0f1621;border-color:var(--accent)}.btn.primary:hover{opacity:.9}
.btn.sm{padding:4px 10px;font-size:11px}
.btn.danger{color:var(--red);border-color:var(--red)}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg3);color:var(--text);cursor:pointer}
.tbl th.r,.tbl td.r{text-align:right}
.mono{font-family:monospace}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.03em}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:12px;width:620px;max-width:95vw;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1}
.modal-title{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:22px;line-height:1}.modal-close:hover{color:var(--text)}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--card)}

/* ── FORM ── */
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.form-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:13px;padding:8px 10px;outline:none;transition:.15s}
.form-input:focus{border-color:var(--accent)}
.form-input[type=number]{-moz-appearance:textfield}
textarea.form-input{resize:vertical;min-height:64px}
select.form-input option{background:var(--bg3)}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.section-label{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);padding:10px 0 7px;border-top:1px solid var(--border);margin-top:4px}

/* ── SUBTABS ── */
.subtabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);padding:0 16px}
.subtab{padding:10px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.15s}
.subtab:hover{color:var(--text)}.subtab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── CF SPECIFIC ── */
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);align-items:center}
.filter-bar select,.filter-bar input{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-size:11px;padding:5px 9px;outline:none;height:30px}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent);color:var(--text)}
.filter-label{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.tag-chip{display:inline-flex;padding:1px 7px;border-radius:10px;font-size:9px;font-weight:700;background:rgba(169,116,230,.15);color:var(--violet);border:1px solid rgba(169,116,230,.25)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-icon{font-size:44px;margin-bottom:14px}
.empty h3{font-size:15px;color:var(--text2);margin-bottom:8px}
.empty p{font-size:12px;margin-bottom:18px}
</style>
</head>
<body>

<nav class="topbar">
  <div class="logo">MACC<span>Management Accounting</span></div>
  <button class="nav-item active" id="nav-sites"       onclick="navigate('sites')">Об'єкти</button>
  <button class="nav-item"        id="nav-budgets"     onclick="navigate('budgets')">Бюджети об'єктів</button>
  <button class="nav-item"        id="nav-executors"   onclick="navigate('executors')">Виконавці та підрядники</button>
  <button class="nav-item"        id="nav-cashflow"    onclick="navigate('cashflow')">Грошові потоки</button>
  <button class="nav-item"        id="nav-dashboard"   onclick="navigate('dashboard')">Дашборд</button>
</nav>

<div class="main" id="main-content"></div>

<!-- ═══════════ MODALS ═══════════ -->

<!-- Об'єкт -->
<div class="modal-overlay" id="modal-site">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modal-site-title">Новий об'єкт</span>
      <button class="modal-close" onclick="closeModal('site')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Назва об'єкту *</label>
        <input class="form-input" id="s-name" placeholder="напр. ЖК Сонячний, вул. Паркова 12"></div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Тип договору</label>
          <select class="form-input" id="s-contract-type">
            <option value="general">Генпідряд</option>
            <option value="sub">Субпідряд</option>
            <option value="own">Власне будівництво</option>
            <option value="design-build">Проект + Будівництво</option>
          </select></div>
        <div class="form-group"><label class="form-label">Замовник</label>
          <input class="form-input" id="s-client" placeholder="назва компанії або ПІБ"></div>
      </div>
      <div class="form-group"><label class="form-label">Адреса об'єкту</label>
        <input class="form-input" id="s-address" placeholder="вул. Назва, номер, місто"></div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Сума договору, грн</label>
          <input class="form-input" type="number" id="s-amount" placeholder="0" min="0" step="0.01"></div>
        <div class="form-group"><label class="form-label">Статус</label>
          <select class="form-input" id="s-status">
            <option value="active">В роботі</option>
            <option value="pause">Призупинено</option>
            <option value="done">Завершено</option>
          </select></div>
      </div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Дата підписання договору</label>
          <input class="form-input" type="date" id="s-sign-date"></div>
        <div class="form-group"><label class="form-label">Дата виконання умов договору</label>
          <input class="form-input" type="date" id="s-deadline"></div>
      </div>
      <div class="form-group"><label class="form-label">Примітки</label>
        <textarea class="form-input" id="s-notes" rows="2" placeholder="додаткова інформація..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('site')">Скасувати</button>
      <button class="btn primary" onclick="saveSite()">Зберегти</button>
    </div>
  </div>
</div>

<!-- Підрядник -->
<div class="modal-overlay" id="modal-contractor">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modal-contractor-title">Новий підрядник</span>
      <button class="modal-close" onclick="closeModal('contractor')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Назва компанії / ПІБ *</label>
        <input class="form-input" id="c-name" placeholder="ТОВ «Назва» або Іваненко Іван"></div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Контактна особа</label>
          <input class="form-input" id="c-contact" placeholder="ПІБ відповідального"></div>
        <div class="form-group"><label class="form-label">Телефон</label>
          <input class="form-input" id="c-phone" placeholder="+38 (0XX) XXX-XX-XX"></div>
      </div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Email</label>
          <input class="form-input" id="c-email" type="email" placeholder="email@company.ua"></div>
        <div class="form-group"><label class="form-label">Платник ПДВ</label>
          <select class="form-input" id="c-vat">
            <option value="yes">Так, платник ПДВ</option>
            <option value="no">Ні, не платник ПДВ</option>
          </select></div>
      </div>
      <div class="form-group"><label class="form-label">Вид робіт / спеціалізація</label>
        <input class="form-input" id="c-worktype" placeholder="напр. Фундаментні роботи, Електромонтаж..."></div>
      <div class="form-group"><label class="form-label">Примітки</label>
        <textarea class="form-input" id="c-notes" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('contractor')">Скасувати</button>
      <button class="btn primary" onclick="saveContractor()">Зберегти</button>
    </div>
  </div>
</div>

<!-- Виконавець -->
<div class="modal-overlay" id="modal-executor">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modal-executor-title">Новий виконавець</span>
      <button class="modal-close" onclick="closeModal('executor')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Ім'я та прізвище *</label>
        <input class="form-input" id="e-name" placeholder="Іваненко Іван Іванович"></div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Посада</label>
          <input class="form-input" id="e-position" placeholder="напр. Виконроб, Інженер, ПМ..."></div>
        <div class="form-group"><label class="form-label">Рівень ЗП, грн/міс</label>
          <input class="form-input" type="number" id="e-salary" placeholder="0"></div>
      </div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Телефон</label>
          <input class="form-input" id="e-phone" placeholder="+38 (0XX) XXX-XX-XX"></div>
        <div class="form-group"><label class="form-label">Email</label>
          <input class="form-input" id="e-email" type="email" placeholder="email@example.com"></div>
      </div>
      <div class="form-group"><label class="form-label">Примітки</label>
        <textarea class="form-input" id="e-notes" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('executor')">Скасувати</button>
      <button class="btn primary" onclick="saveExecutor()">Зберегти</button>
    </div>
  </div>
</div>

<!-- Транзакція -->
<div class="modal-overlay" id="modal-cf">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modal-cf-title">Нова транзакція</span>
      <button class="modal-close" onclick="closeModal('cf')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Тип *</label>
          <select class="form-input" id="cf-type">
            <option value="income">📈 Дохід</option>
            <option value="expense">📉 Розхід</option>
          </select></div>
        <div class="form-group"><label class="form-label">Форма оплати *</label>
          <select class="form-input" id="cf-form">
            <option value="bank">🏦 Рахунок (банк)</option>
            <option value="cash">💵 Готівка</option>
          </select></div>
      </div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Дата *</label>
          <input class="form-input" type="date" id="cf-date"></div>
        <div class="form-group"><label class="form-label">Сума, грн *</label>
          <input class="form-input" type="number" id="cf-amount" placeholder="0" min="0" step="0.01"></div>
      </div>
      <datalist id="cf-cat-list"></datalist>
      <datalist id="cf-cp-list"></datalist>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Категорія</label>
          <input class="form-input" id="cf-category" list="cf-cat-list" placeholder="введіть або оберіть..."></div>
        <div class="form-group"><label class="form-label">Об'єкт</label>
          <select class="form-input" id="cf-site">
            <option value="">— Без об'єкта —</option>
          </select></div>
      </div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Контрагент</label>
          <input class="form-input" id="cf-counterparty" list="cf-cp-list" placeholder="введіть або оберіть..."></div>
        <div class="form-group"><label class="form-label">Тег</label>
          <input class="form-input" id="cf-tag" placeholder="напр. матеріали, зарплата..."></div>
      </div>
      <div class="form-group"><label class="form-label">Примітки</label>
        <textarea class="form-input" id="cf-notes" rows="2"></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('cf')">Скасувати</button>
      <button class="btn primary" onclick="saveCF()">Зберегти</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════════════════════
const FB_URL='https://macc-d6e9b-default-rtdb.europe-west1.firebasedatabase.app';

const CONTRACT_TYPE={
  general:'Генпідряд',
  sub:'Субпідряд',
  own:'Власне будівництво',
  'design-build':'Проект+Будівництво'
};
const CONTRACT_COLOR={
  general:'#f0b429',sub:'#38bdf8',own:'#4ade80','design-build':'#a974e6'
};
const STATUS_LABEL={active:'В роботі',pause:'Призупинено',done:'Завершено'};
const STATUS_COLOR={active:'#4ade80',pause:'#9ca3af',done:'#38bdf8'};
const CF_FORM_LABEL={cash:'💵 Готівка',bank:'🏦 Рахунок'};

// ══════════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════════
let state={
  sites:[],
  contractors:[],
  executors:[],
  cashflows:[],
  cfCategories:[],
  cfCounterparties:[]
};
let curPage='sites';
let editingSiteId=null, editingContractorId=null, editingExecutorId=null, editingCFId=null;
let execTab='contractors';
let cfFilters={type:'',form:'',category:'',site:'',tag:'',month:'',search:''};

// ══════════════════════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════════════════════
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtN(n){return new Intl.NumberFormat('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2}).format(+n||0)}
function fmtD(d){if(!d)return'—';const[y,m,day]=d.split('-');return`${day}.${m}.${y}`}
function daysLeft(d){if(!d)return null;return Math.round((new Date(d)-new Date())/(1000*86400))}

function contractBadge(t){
  const lbl=CONTRACT_TYPE[t]||t||'';
  const col=CONTRACT_COLOR[t]||'#9ca3af';
  return`<span class="badge" style="background:${col}22;color:${col};border:1px solid ${col}44">${lbl}</span>`;
}
function statusBadge(s){
  const lbl=STATUS_LABEL[s]||s||'';
  const col=STATUS_COLOR[s]||'#9ca3af';
  return`<span class="badge" style="background:${col}22;color:${col};border:1px solid ${col}44">${lbl}</span>`;
}

// site income/expense from cashflow
function siteIncome(siteId){return(state.cashflows||[]).filter(c=>c.siteId===siteId&&c.type==='income').reduce((a,c)=>a+(+c.amount||0),0)}
function siteExpense(siteId){return(state.cashflows||[]).filter(c=>c.siteId===siteId&&c.type==='expense').reduce((a,c)=>a+(+c.amount||0),0)}

// ══════════════════════════════════════════════════════════════
//  STORAGE
// ══════════════════════════════════════════════════════════════
function save(){
  localStorage.setItem('macc_state',JSON.stringify(state));
  fetch(`${FB_URL}/data.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)}).catch(()=>{});
}
function load(){
  const loc=localStorage.getItem('macc_state');
  if(loc){try{const d=JSON.parse(loc);if(d)applyState(d);}catch(e){}}
  fetch(`${FB_URL}/data.json`).then(r=>r.json()).then(d=>{
    if(d&&(d.sites||d.cashflows)){applyState(d);localStorage.setItem('macc_state',JSON.stringify(state));render();}
  }).catch(()=>{});
  render();
}
function applyState(d){
  state.sites=d.sites||[];
  state.contractors=d.contractors||d.subs||[];   // migrate old 'subs' key
  state.executors=d.executors||d.itrs||[];       // migrate old 'itrs' key
  state.cashflows=d.cashflows||[];
  state.cfCategories=d.cfCategories||[];
  state.cfCounterparties=d.cfCounterparties||[];
}

// ══════════════════════════════════════════════════════════════
//  NAVIGATION
// ══════════════════════════════════════════════════════════════
function navigate(page){
  curPage=page;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const nb=document.getElementById('nav-'+page);
  if(nb)nb.classList.add('active');
  render();
}
function render(){
  if(curPage==='sites')       renderSites();
  else if(curPage==='budgets')     renderBudgets();
  else if(curPage==='executors')   renderExecutors();
  else if(curPage==='cashflow')    renderCashflow();
  else if(curPage==='dashboard')   renderDashboard();
}
function closeModal(name){document.getElementById('modal-'+name).classList.remove('open')}

// ══════════════════════════════════════════════════════════════
//  ОБ'ЄКТИ
// ══════════════════════════════════════════════════════════════
function renderSites(){
  const el=document.getElementById('main-content');
  const sites=state.sites||[];

  // aggregate totals
  let totAmount=0, totIncome=0, totExpense=0;
  sites.forEach(s=>{
    totAmount+=(+s.amountGross||0);
    totIncome+=siteIncome(s.id);
    totExpense+=siteExpense(s.id);
  });

  let tbody='';
  if(!sites.length){
    tbody=`<tr><td colspan="8"><div class="empty"><div class="empty-icon">🏗️</div><h3>Об'єктів ще немає</h3><p>Натисніть «+ Новий об'єкт» щоб додати перший</p></div></td></tr>`;
  } else {
    sites.forEach(s=>{
      const inc=siteIncome(s.id);
      const exp=siteExpense(s.id);
      const bal=inc-exp;
      const dl=daysLeft(s.deadline);
      const dlColor=!s.deadline||s.status==='done'?'var(--text3)':dl<0?'var(--red)':dl<=30?'var(--amber)':'var(--green)';
      tbody+=`<tr onclick="openSiteModal('${s.id}')">
        <td style="color:var(--text);font-weight:600">${esc(s.name)}</td>
        <td>${contractBadge(s.contractType)}</td>
        <td>${esc(s.client||'—')}</td>
        <td class="r mono">${fmtN(s.amountGross)}</td>
        <td class="r mono" style="color:var(--green)">${fmtN(inc)}</td>
        <td class="r mono" style="color:var(--red)">${fmtN(exp)}</td>
        <td class="r mono" style="font-weight:700;color:${bal>=0?'var(--accent)':'var(--red)'}">${fmtN(bal)}</td>
        <td style="color:${dlColor};white-space:nowrap">${fmtD(s.deadline)}</td>
      </tr>`;
    });
  }

  el.innerHTML=`
    <div class="page-header">
      <h1 class="page-title">🏗 Об'єкти</h1>
      <button class="btn primary" onclick="openSiteModal(null)">+ Новий об'єкт</button>
    </div>
    <div class="metrics">
      <div class="metric" style="--mc:var(--accent)"><div class="metric-label">Всього об'єктів</div><div class="metric-value">${sites.length}</div></div>
      <div class="metric" style="--mc:var(--text3)"><div class="metric-label">Сума договорів</div><div class="metric-value" style="font-size:15px">${fmtN(totAmount)}</div></div>
      <div class="metric" style="--mc:var(--green)"><div class="metric-label">Отримано (з грош. потоків)</div><div class="metric-value" style="font-size:15px">${fmtN(totIncome)}</div></div>
      <div class="metric" style="--mc:var(--red)"><div class="metric-label">Витрачено (з грош. потоків)</div><div class="metric-value" style="font-size:15px">${fmtN(totExpense)}</div></div>
      <div class="metric" style="--mc:${totIncome-totExpense>=0?'var(--amber)':'var(--red)'}"><div class="metric-label">Баланс</div><div class="metric-value" style="font-size:15px;color:${totIncome-totExpense>=0?'var(--accent)':'var(--red)'}">${fmtN(totIncome-totExpense)}</div></div>
    </div>
    <div class="card">
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>
            <th>Назва об'єкту</th><th>Тип договору</th><th>Замовник</th>
            <th class="r">Сума договору</th><th class="r">Отримано</th>
            <th class="r">Витрачено</th><th class="r">Баланс</th><th>Дата виконання</th>
          </tr></thead>
          <tbody>${tbody}</tbody>
        </table>
      </div>
    </div>`;
}

function openSiteModal(id){
  editingSiteId=id||null;
  const s=id?(state.sites||[]).find(x=>x.id===id):null;
  document.getElementById('modal-site-title').textContent=id?'Редагувати об\'єкт':'Новий об\'єкт';
  document.getElementById('s-name').value=s?.name||'';
  document.getElementById('s-contract-type').value=s?.contractType||'general';
  document.getElementById('s-client').value=s?.client||'';
  document.getElementById('s-address').value=s?.address||'';
  document.getElementById('s-amount').value=s?.amountGross||'';
  document.getElementById('s-status').value=s?.status||'active';
  document.getElementById('s-sign-date').value=s?.signDate||'';
  document.getElementById('s-deadline').value=s?.deadline||'';
  document.getElementById('s-notes').value=s?.notes||'';
  document.getElementById('modal-site').classList.add('open');
}
function saveSite(){
  const name=document.getElementById('s-name').value.trim();
  if(!name){alert('Введіть назву об\'єкту');return;}
  const data={
    id:editingSiteId||uid(),
    name,
    contractType:document.getElementById('s-contract-type').value,
    client:document.getElementById('s-client').value.trim(),
    address:document.getElementById('s-address').value.trim(),
    amountGross:+document.getElementById('s-amount').value||0,
    status:document.getElementById('s-status').value,
    signDate:document.getElementById('s-sign-date').value,
    deadline:document.getElementById('s-deadline').value,
    notes:document.getElementById('s-notes').value.trim(),
  };
  if(editingSiteId){const i=state.sites.findIndex(x=>x.id===editingSiteId);if(i>=0)state.sites[i]=data;}
  else state.sites.push(data);
  save();closeModal('site');renderSites();
}
function deleteSite(id){
  if(!confirm('Видалити об\'єкт?'))return;
  state.sites=state.sites.filter(x=>x.id!==id);
  save();renderSites();
}

function renderBudgets(){
  const el=document.getElementById('main-content');
  const sites=state.sites||[];
  let tbody='';
  if(!sites.length){
    tbody=`<tr><td colspan="6"><div class="empty"><div class="empty-icon">📊</div><h3>Немає об'єктів</h3><p>Спочатку додайте об'єкти в розділі «Об'єкти»</p><button class="btn primary" onclick="navigate('sites')">Перейти до Об'єктів</button></div></td></tr>`;
  } else {
    sites.forEach(s=>{
      const inc=siteIncome(s.id);
      const exp=siteExpense(s.id);
      const bal=inc-exp;
      const gross=+s.amountGross||0;
      const margin=gross?((inc-exp)/gross*100):null;
      tbody+=`<tr>
        <td style="color:var(--text);font-weight:600">${esc(s.name)}</td>
        <td>${contractBadge(s.contractType)}</td>
        <td class="r mono">${fmtN(gross)}</td>
        <td class="r mono" style="color:var(--green)">${fmtN(inc)}</td>
        <td class="r mono" style="color:var(--red)">${fmtN(exp)}</td>
        <td class="r mono" style="font-weight:700;color:${bal>=0?'var(--accent)':'var(--red)'}">${fmtN(bal)}</td>
        <td class="r" style="color:${margin===null?'var(--text3)':margin>=0?'var(--green)':'var(--red)'};font-weight:700">${margin===null?'—':margin.toFixed(1)+'%'}</td>
      </tr>`;
    });
  }
  el.innerHTML=`
    <div class="page-header">
      <h1 class="page-title">📊 Бюджети об'єктів</h1>
    </div>
    <div class="card">
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>
            <th>Назва об'єкту</th><th>Тип</th><th class="r">Сума договору</th>
            <th class="r">Отримано</th><th class="r">Витрачено</th><th class="r">Баланс</th><th class="r">Маржа</th>
          </tr></thead>
          <tbody>${tbody}</tbody>
        </table>
      </div>
    </div>`;
}

function renderCashflow(){
  const el=document.getElementById('main-content');
  const all=state.cashflows||[];

  let rows=[...all].sort((a,b)=>b.date.localeCompare(a.date));
  if(cfFilters.type)    rows=rows.filter(r=>r.type===cfFilters.type);
  if(cfFilters.form)    rows=rows.filter(r=>r.form===cfFilters.form);
  if(cfFilters.category)rows=rows.filter(r=>r.category===cfFilters.category);
  if(cfFilters.site)    rows=rows.filter(r=>r.siteId===cfFilters.site);
  if(cfFilters.tag)     rows=rows.filter(r=>(r.tag||'').toLowerCase().includes(cfFilters.tag.toLowerCase()));
  if(cfFilters.month)   rows=rows.filter(r=>r.date.slice(0,7)===cfFilters.month);
  if(cfFilters.search){const q=cfFilters.search.toLowerCase();rows=rows.filter(r=>(r.counterparty||'').toLowerCase().includes(q)||(r.notes||'').toLowerCase().includes(q)||(r.category||'').toLowerCase().includes(q)||(r.tag||'').toLowerCase().includes(q));}

  const totInc =rows.filter(r=>r.type==='income').reduce((a,r)=>a+(+r.amount||0),0);
  const totExp =rows.filter(r=>r.type==='expense').reduce((a,r)=>a+(+r.amount||0),0);
  const cashInc=rows.filter(r=>r.type==='income'&&r.form==='cash').reduce((a,r)=>a+(+r.amount||0),0);
  const cashExp=rows.filter(r=>r.type==='expense'&&r.form==='cash').reduce((a,r)=>a+(+r.amount||0),0);
  const bankInc=rows.filter(r=>r.type==='income'&&r.form==='bank').reduce((a,r)=>a+(+r.amount||0),0);
  const bankExp=rows.filter(r=>r.type==='expense'&&r.form==='bank').reduce((a,r)=>a+(+r.amount||0),0);
  const balance=totInc-totExp, cashBal=cashInc-cashExp, bankBal=bankInc-bankExp;

  const usedCats=[...new Set(all.map(r=>r.category).filter(Boolean))];
  const allCats=[...new Set([...(state.cfCategories||[]),...usedCats])].sort();
  const sites=state.sites||[];

  const sub=(label,val)=>`<div style="display:flex;justify-content:space-between;margin-top:5px;padding-top:4px;border-top:1px solid var(--border)"><span style="font-size:9px;color:var(--text3)">${label}</span><span style="font-size:11px;font-weight:600;color:var(--text2)">${fmtN(val)}</span></div>`;

  const metrics=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
    <div class="metric" style="--mc:${balance>=0?'var(--accent)':'var(--red)'}">
      <div class="metric-label">⚖ Баланс</div>
      <div class="metric-value" style="color:${balance>=0?'var(--accent)':'var(--red)'}">${fmtN(balance)}</div>
      ${sub('🏦 Рахунок',bankBal)}${sub('💵 Готівка',cashBal)}
    </div>
    <div class="metric" style="--mc:var(--green)">
      <div class="metric-label">📈 Доходи</div>
      <div class="metric-value" style="color:var(--green)">${fmtN(totInc)}</div>
      ${sub('🏦 Рахунок',bankInc)}${sub('💵 Готівка',cashInc)}
    </div>
    <div class="metric" style="--mc:var(--red)">
      <div class="metric-label">📉 Витрати</div>
      <div class="metric-value" style="color:var(--red)">${fmtN(totExp)}</div>
      ${sub('🏦 Рахунок',bankExp)}${sub('💵 Готівка',cashExp)}
    </div>
  </div>`;

  const filterBar=`<div class="filter-bar">
    <span class="filter-label">Фільтри:</span>
    <select onchange="cfFilters.type=this.value;renderCashflow()">
      <option value="">Всі типи</option>
      <option value="income"  ${cfFilters.type==='income' ?'selected':''}>📈 Доходи</option>
      <option value="expense" ${cfFilters.type==='expense'?'selected':''}>📉 Витрати</option>
    </select>
    <select onchange="cfFilters.form=this.value;renderCashflow()">
      <option value="">Всі форми</option>
      <option value="cash" ${cfFilters.form==='cash'?'selected':''}>💵 Готівка</option>
      <option value="bank" ${cfFilters.form==='bank'?'selected':''}>🏦 Рахунок</option>
    </select>
    <select onchange="cfFilters.category=this.value;renderCashflow()" style="min-width:150px">
      <option value="">Всі категорії</option>
      ${allCats.map(c=>`<option value="${esc(c)}"${cfFilters.category===c?' selected':''}>${esc(c)}</option>`).join('')}
    </select>
    <select onchange="cfFilters.site=this.value;renderCashflow()" style="min-width:130px">
      <option value="">Всі об'єкти</option>
      ${sites.map(s=>`<option value="${s.id}"${cfFilters.site===s.id?' selected':''}>${esc(s.name)}</option>`).join('')}
    </select>
    <input type="month" value="${cfFilters.month}" onchange="cfFilters.month=this.value;renderCashflow()" title="Місяць">
    <input placeholder="🔍 Пошук..." value="${esc(cfFilters.search)}" oninput="cfFilters.search=this.value;renderCashflow()" style="min-width:120px">
    <input placeholder="Тег..." value="${esc(cfFilters.tag)}" oninput="cfFilters.tag=this.value;renderCashflow()" style="min-width:80px">
    ${Object.values(cfFilters).some(v=>v)?`<button class="btn sm" onclick="cfFilters={type:'',form:'',category:'',site:'',tag:'',month:'',search:''};renderCashflow()">✕ Скинути</button>`:''}
  </div>`;

  let tbody='';
  if(!rows.length){
    tbody=`<tr><td colspan="9"><div class="empty"><div class="empty-icon">💸</div><h3>${all.length?'Нічого не знайдено':'Транзакцій ще немає'}</h3><p>${all.length?'Спробуйте інші фільтри':'Натисніть «+ Дохід» або «+ Розхід»'}</p></div></td></tr>`;
  } else {
    rows.forEach(r=>{
      const site=sites.find(s=>s.id===r.siteId);
      const isInc=r.type==='income';
      tbody+=`<tr onclick="openCFModal('${r.id}')">
        <td style="color:var(--text3);white-space:nowrap">${fmtD(r.date)}</td>
        <td><span class="badge" style="${isInc?'background:rgba(74,222,128,.12);color:#4ade80;border:1px solid rgba(74,222,128,.3)':'background:rgba(248,113,113,.12);color:#f87171;border:1px solid rgba(248,113,113,.3)'}">${isInc?'📈 Дохід':'📉 Розхід'}</span></td>
        <td style="font-size:11px;color:var(--text3)">${CF_FORM_LABEL[r.form]||r.form}</td>
        <td style="font-size:11px">${esc(r.category||'—')}</td>
        <td>${site?`<span style="font-size:10px;color:var(--accent);font-weight:600">${esc(site.name)}</span>`:'<span style="color:var(--text3);font-size:10px">—</span>'}</td>
        <td>${esc(r.counterparty||'—')}</td>
        <td>${r.tag?`<span class="tag-chip">${esc(r.tag)}</span>`:'<span style="color:var(--text3);font-size:10px">—</span>'}</td>
        <td class="r mono" style="font-size:13px;font-weight:700;${isInc?'color:var(--green)':'color:var(--red)'}">${isInc?'+':'-'}${fmtN(r.amount)}</td>
        <td onclick="event.stopPropagation()"><button class="btn sm danger" onclick="deleteCF('${r.id}')">×</button></td>
      </tr>`;
      if(r.notes)tbody+=`<tr><td colspan="9" style="padding:2px 10px 8px;font-size:10px;color:var(--text3);border-bottom:1px solid var(--border)">💬 ${esc(r.notes)}</td></tr>`;
    });
  }

  // category summary
  const catSummary=[];
  [...new Set(rows.map(r=>r.category).filter(Boolean))].forEach(cat=>{
    const cr=rows.filter(r=>r.category===cat);
    const inc=cr.filter(r=>r.type==='income').reduce((a,r)=>a+(+r.amount||0),0);
    const exp=cr.filter(r=>r.type==='expense').reduce((a,r)=>a+(+r.amount||0),0);
    catSummary.push({cat,inc,exp,count:cr.length});
  });

  el.innerHTML=`
    <div class="page-header">
      <h1 class="page-title">💸 Грошові потоки</h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" onclick="manageCFCategories()">⚙ Категорії</button>
        <button class="btn sm" onclick="manageCFCounterparties()">⚙ Контрагенти</button>
        <button class="btn" onclick="openCFModal(null,'income')">+ 📈 Дохід</button>
        <button class="btn primary" onclick="openCFModal(null,'expense')">+ 📉 Розхід</button>
      </div>
    </div>
    ${metrics}
    <div class="card" style="margin-bottom:14px;overflow:visible">
      ${filterBar}
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>
            <th>Дата</th><th>Тип</th><th>Форма</th><th>Категорія</th>
            <th>Об'єкт</th><th>Контрагент</th><th>Тег</th>
            <th class="r">Сума</th><th></th>
          </tr></thead>
          <tbody>${tbody}</tbody>
        </table>
      </div>
      ${rows.length?`<div style="padding:8px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--text3)">${rows.length} записів · Доходи: <span style="color:var(--green);font-weight:700">${fmtN(totInc)}</span> · Витрати: <span style="color:var(--red);font-weight:700">${fmtN(totExp)}</span> · Баланс: <span style="font-weight:700;color:${balance>=0?'var(--accent)':'var(--red)'}">${fmtN(balance)}</span></div>`:''}
    </div>
    ${catSummary.length?`<div class="card">
      <div class="card-head"><span class="card-title">📊 Зведення по категоріях</span></div>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>Категорія</th><th class="r">Записів</th><th class="r">Доходи</th><th class="r">Витрати</th><th class="r">Баланс</th></tr></thead>
        <tbody>${catSummary.sort((a,b)=>(b.inc+b.exp)-(a.inc+a.exp)).map(c=>`<tr>
          <td style="font-weight:600;color:var(--text)">${esc(c.cat)}</td>
          <td class="r" style="color:var(--text3)">${c.count}</td>
          <td class="r" style="color:var(--green)">${c.inc?fmtN(c.inc):'—'}</td>
          <td class="r" style="color:var(--red)">${c.exp?fmtN(c.exp):'—'}</td>
          <td class="r mono" style="font-weight:700;color:${c.inc-c.exp>=0?'var(--green)':'var(--red)'}">${fmtN(c.inc-c.exp)}</td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>`:''}`;
}

function openCFModal(id,defaultType){
  editingCFId=id||null;
  const r=id?(state.cashflows||[]).find(x=>x.id===id):null;
  document.getElementById('modal-cf-title').textContent=id?'Редагувати транзакцію':'Нова транзакція';
  document.getElementById('cf-type').value=r?.type||defaultType||'income';
  document.getElementById('cf-form').value=r?.form||'bank';
  document.getElementById('cf-date').value=r?.date||new Date().toISOString().slice(0,10);
  document.getElementById('cf-amount').value=r?.amount||'';
  document.getElementById('cf-tag').value=r?.tag||'';
  document.getElementById('cf-notes').value=r?.notes||'';
  const siteSel=document.getElementById('cf-site');
  siteSel.innerHTML='<option value="">— Без об\'єкта —</option>'+(state.sites||[]).map(s=>`<option value="${s.id}"${r?.siteId===s.id?' selected':''}>${esc(s.name)}</option>`).join('');
  const cats=[...new Set([...(state.cfCategories||[]),...(state.cashflows||[]).map(x=>x.category).filter(Boolean)])].sort();
  document.getElementById('cf-cat-list').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
  document.getElementById('cf-category').value=r?.category||'';
  const contractorNames=(state.contractors||[]).map(c=>c.name).filter(Boolean);
  const usedCP=[...new Set((state.cashflows||[]).map(x=>x.counterparty).filter(Boolean))];
  const allCP=[...new Set([...(state.cfCounterparties||[]),...contractorNames,...usedCP])].sort();
  document.getElementById('cf-cp-list').innerHTML=allCP.map(c=>`<option value="${esc(c)}">`).join('');
  document.getElementById('cf-counterparty').value=r?.counterparty||'';
  document.getElementById('modal-cf').classList.add('open');
}
function saveCF(){
  if(!state.cashflows)state.cashflows=[];
  const amount=+document.getElementById('cf-amount').value||0;
  const date=document.getElementById('cf-date').value;
  const category=document.getElementById('cf-category').value.trim();
  if(!date){alert('Введіть дату');return;}
  if(!amount){alert('Введіть суму');return;}
  if(category&&!(state.cfCategories||[]).includes(category)){state.cfCategories=state.cfCategories||[];state.cfCategories.push(category);}
  const data={
    id:editingCFId||uid(),
    type:document.getElementById('cf-type').value,
    form:document.getElementById('cf-form').value,
    date,amount,category,
    siteId:document.getElementById('cf-site').value,
    counterparty:document.getElementById('cf-counterparty').value.trim(),
    tag:document.getElementById('cf-tag').value.trim(),
    notes:document.getElementById('cf-notes').value.trim(),
  };
  if(editingCFId){const i=state.cashflows.findIndex(x=>x.id===editingCFId);if(i>=0)state.cashflows[i]=data;}
  else state.cashflows.push(data);
  save();closeModal('cf');renderCashflow();
}
function deleteCF(id){
  if(!confirm('Видалити транзакцію?'))return;
  state.cashflows=state.cashflows.filter(x=>x.id!==id);save();renderCashflow();
}
function manageCFCategories(){
  const cats=(state.cfCategories||[]).slice().sort();
  const list=cats.map(c=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--text)">${esc(c)}</span><button class="btn sm danger" onclick="deleteCFCat('${esc(c)}')">×</button></div>`).join('');
  showMgr('cat-mgr','⚙ Категорії',list,'new-cat-input','Нова категорія...','addCFCat()');
}
function addCFCat(){
  const inp=document.getElementById('new-cat-input');
  const v=inp.value.trim();if(!v)return;
  if(!state.cfCategories)state.cfCategories=[];
  if(!state.cfCategories.includes(v))state.cfCategories.push(v);
  inp.value='';save();manageCFCategories();
}
function deleteCFCat(cat){state.cfCategories=(state.cfCategories||[]).filter(c=>c!==cat);save();manageCFCategories();}

function manageCFCounterparties(){
  const list=(state.cfCounterparties||[]).slice().sort();
  const items=list.map(c=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--text)">${esc(c)}</span><button class="btn sm danger" onclick="deleteCFCP('${esc(c)}')">×</button></div>`).join('');
  showMgr('cp-mgr','⚙ Контрагенти',items,'new-cp-input','Назва контрагента...','addCFCP()');
}
function addCFCP(){
  const inp=document.getElementById('new-cp-input');
  const v=inp.value.trim();if(!v)return;
  if(!state.cfCounterparties)state.cfCounterparties=[];
  if(!state.cfCounterparties.includes(v))state.cfCounterparties.push(v);
  inp.value='';save();manageCFCounterparties();
}
function deleteCFCP(cp){state.cfCounterparties=(state.cfCounterparties||[]).filter(c=>c!==cp);save();manageCFCounterparties();}

function showMgr(ovId,title,list,inputId,placeholder,addFn){
  const html=`<div style="padding:18px;min-width:320px">
    <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:14px;text-transform:uppercase;letter-spacing:.05em">${title}</div>
    <div style="margin-bottom:12px;max-height:260px;overflow-y:auto">${list||'<div style="font-size:11px;color:var(--text3);padding:10px 0">Список порожній</div>'}</div>
    <div style="display:flex;gap:8px"><input class="form-input" id="${inputId}" placeholder="${placeholder}" style="flex:1"><button class="btn primary sm" onclick="${addFn}">+ Додати</button></div>
    <div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="btn sm" onclick="this.closest('.modal-overlay').classList.remove('open')">Закрити</button></div>
  </div>`;
  let ov=document.getElementById(ovId);
  if(!ov){ov=document.createElement('div');ov.id=ovId;ov.className='modal-overlay';ov.style.zIndex=300;ov.innerHTML='<div class="modal" style="width:420px"></div>';document.body.appendChild(ov);}
  ov.querySelector('.modal').innerHTML=html;
  ov.classList.add('open');
}

// ══════════════════════════════════════════════════════════════
//  ДАШБОРД
// ══════════════════════════════════════════════════════════════
function renderDashboard(){
  const el=document.getElementById('main-content');
  const sites=state.sites||[];
  const cfs=state.cashflows||[];
  const totInc=cfs.filter(r=>r.type==='income').reduce((a,r)=>a+(+r.amount||0),0);
  const totExp=cfs.filter(r=>r.type==='expense').reduce((a,r)=>a+(+r.amount||0),0);
  el.innerHTML=`
    <div class="page-header"><h1 class="page-title">📋 Дашборд</h1></div>
    <div class="metrics">
      <div class="metric" style="--mc:var(--accent)"><div class="metric-label">Всього об'єктів</div><div class="metric-value">${sites.length}</div></div>
      <div class="metric" style="--mc:var(--green)"><div class="metric-label">В роботі</div><div class="metric-value">${sites.filter(s=>s.status==='active').length}</div></div>
      <div class="metric" style="--mc:var(--blue)"><div class="metric-label">Завершено</div><div class="metric-value">${sites.filter(s=>s.status==='done').length}</div></div>
      <div class="metric" style="--mc:var(--green)"><div class="metric-label">Всього доходи</div><div class="metric-value" style="font-size:15px">${fmtN(totInc)}</div></div>
      <div class="metric" style="--mc:var(--red)"><div class="metric-label">Всього витрати</div><div class="metric-value" style="font-size:15px">${fmtN(totExp)}</div></div>
      <div class="metric" style="--mc:${totInc-totExp>=0?'var(--amber)':'var(--red)'}"><div class="metric-label">Загальний баланс</div><div class="metric-value" style="font-size:15px;color:${totInc-totExp>=0?'var(--accent)':'var(--red)'}">${fmtN(totInc-totExp)}</div></div>
    </div>
    <div class="empty" style="margin-top:30px"><div class="empty-icon">🚧</div><h3>Дашборд в розробці</h3><p>Тут будуть аналітичні графіки та зведені показники</p></div>`;
}

load();
</script>
