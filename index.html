<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MACC — Management Accounting in a Construction Company</title>
<style>
:root{
  --bg:#0f1621;--bg2:#151d2b;--bg3:#1a2336;--card:#1e2a3a;--card2:#243044;
  --border:#2a3a52;--border2:#334d6e;
  --text:#e8edf5;--text2:#a0afc0;--text3:#5a7090;
  --accent:#f0b429;--green:#4ade80;--red:#f87171;--amber:#fbbf24;
  --blue:#38bdf8;--violet:#a974e6;--radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.topbar{display:flex;align-items:center;height:52px;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;gap:0;position:sticky;top:0;z-index:100;overflow-x:auto}
.logo{font-size:17px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-right:24px;white-space:nowrap}
.logo span{font-size:10px;font-weight:400;color:var(--text3);display:block;letter-spacing:.05em;margin-top:-2px}
.nav-item{padding:0 12px;height:52px;display:flex;align-items:center;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.nav-item:hover{color:var(--text)}.nav-item.active{color:var(--accent);border-bottom-color:var(--accent)}
.main{padding:20px 16px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-title{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.card-body{padding:16px}
.metrics{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;min-width:140px;flex:1;border-top:2px solid var(--mc,var(--accent))}
.metric-label{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.metric-value{font-size:17px;font-weight:700;color:var(--text)}
.metric-group-label{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:.15s}
.btn:hover{color:var(--text);border-color:var(--accent)}.btn.primary{background:var(--accent);color:#0f1621;border-color:var(--accent)}.btn.primary:hover{opacity:.9}.btn.sm{padding:4px 10px;font-size:11px}
.btn.budget{background:linear-gradient(135deg,#1a2d4a,#243044);border:1px solid var(--border2);color:var(--text);padding:16px 24px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;transition:.2s;width:100%}
.btn.budget:hover{border-color:var(--accent);color:var(--accent)}
.status-badge{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.04em}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);padding:7px 8px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:8px 8px;border-bottom:1px solid var(--border);font-size:11px;color:var(--text2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}.tbl tr:hover td{background:var(--bg3);color:var(--text);cursor:pointer}.tbl .mono{font-family:monospace;font-size:11px}
.tbl th.r,.tbl td.r{text-align:right}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:12px;width:700px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;line-height:1}.modal-close:hover{color:var(--text)}
.modal-body{padding:18px}.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.form-group{margin-bottom:12px}
.form-label{display:block;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.form-input{width:100%;padding:8px 11px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:13px;outline:none}
.form-input:focus{border-color:var(--accent)}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
select.form-input option{background:var(--bg3)}
.empty-state{text-align:center;padding:50px 20px;color:var(--text3)}
.empty-state h3{font-size:15px;color:var(--text2);margin-bottom:8px}
.empty-state p{font-size:12px;margin-bottom:18px}
.s-active{background:rgba(74,222,128,.12);color:#4ade80;border:1px solid rgba(74,222,128,.25)}
.s-pause{background:rgba(107,114,128,.12);color:#9ca3af;border:1px solid rgba(107,114,128,.25)}
.s-done{background:rgba(56,189,248,.12);color:#38bdf8;border:1px solid rgba(56,189,248,.25)}
.s-archive{background:rgba(90,112,144,.10);color:#5a7090;border:1px solid rgba(90,112,144,.2)}
.ct-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:.04em}
.subtab{padding:8px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.15s}
.subtab:hover{color:var(--text)}.subtab.active{color:var(--accent);border-bottom-color:var(--accent)}
.section-divider{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);padding:10px 0 7px;border-top:1px solid var(--border);margin-top:4px}
.filter-bar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);align-items:center}
.filter-bar select,.filter-bar input{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-size:11px;padding:5px 9px;outline:none;height:30px}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent);color:var(--text)}
.filter-bar .filter-label{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.cf-income{color:var(--green);font-weight:700}
.cf-expense{color:var(--red);font-weight:700}
.tag-chip{display:inline-flex;padding:1px 7px;border-radius:10px;font-size:9px;font-weight:700;background:rgba(169,116,230,.15);color:var(--violet);border:1px solid rgba(169,116,230,.25)}
</style>
</head>
<body>

<nav class="topbar">
  <div class="logo">MACC<span>Management Accounting</span></div>
  <button class="nav-item" onclick="navigate('dashboard')" id="nav-dashboard">Дашборд</button>
  <button class="nav-item active" onclick="navigate('sites')" id="nav-sites">Майданчики</button>
  <button class="nav-item" onclick="navigate('executors')" id="nav-executors">Виконавці</button>
  <button class="nav-item" onclick="navigate('budgets')" id="nav-budgets">Бюджети об'єктів</button>
  <button class="nav-item" onclick="navigate('economics')" id="nav-economics">Економіка</button>
  <button class="nav-item" onclick="navigate('cashflow')" id="nav-cashflow">Грошові потоки</button>
  <button class="nav-item" onclick="navigate('reports')" id="nav-reports">Звіти</button>
</nav>

<div class="main" id="main-content"></div>

<!-- ═══ MODAL: ТРАНЗАКЦІЯ ═══ -->
<div class="modal-overlay" id="modal-cf">
  <div class="modal" style="width:580px">
    <div class="modal-head">
      <span class="modal-title" id="modal-cf-title">Нова транзакція</span>
      <button class="modal-close" onclick="closeModal('cf')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Тип *</label>
          <select class="form-input" id="cf-type">
            <option value="income">📈 Дохід</option>
            <option value="expense">📉 Розхід</option>
          </select></div>
        <div class="form-group"><label class="form-label">Форма оплати *</label>
          <select class="form-input" id="cf-form">
            <option value="cash">💵 Готівка</option>
            <option value="bank">🏦 Рахунок (банк)</option>
          </select></div>
      </div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Дата *</label>
          <input class="form-input" type="date" id="cf-date"></div>
        <div class="form-group"><label class="form-label">Сума, грн *</label>
          <input class="form-input" type="number" id="cf-amount" placeholder="0" min="0" step="0.01"></div>
      </div>
      <datalist id="cf-cat-list"></datalist>
      <datalist id="cf-cp-list"></datalist>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Категорія</label>
          <input class="form-input" id="cf-category" list="cf-cat-list" placeholder="введіть або оберіть..."></div>
        <div class="form-group"><label class="form-label">Об'єкт</label>
          <select class="form-input" id="cf-site">
            <option value="">— Без об'єкта —</option>
          </select></div>
      </div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Контрагент</label>
          <input class="form-input" id="cf-counterparty" list="cf-cp-list" placeholder="введіть або оберіть..."></div>
        <div class="form-group"><label class="form-label">Тег</label>
          <input class="form-input" id="cf-tag" placeholder="напр. податки, зарплата, матеріали..."></div>
      </div>
      <div class="form-group"><label class="form-label">Примітки</label>
        <textarea class="form-input" id="cf-notes" rows="2" placeholder="додаткова інформація..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('cf')">Скасувати</button>
      <button class="btn primary" onclick="saveCF()">Зберегти</button>
    </div>
  </div>
</div>

<!-- ═══ MODAL: МАЙДАНЧИК ═══ -->
<div class="modal-overlay" id="modal-site">
  <div class="modal" style="width:720px">
    <div class="modal-head">
      <span class="modal-title" id="modal-site-title">Новий майданчик</span>
      <button class="modal-close" onclick="closeModal('site')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Назва об'єкта *</label>
        <input class="form-input" id="s-name" placeholder="напр. ЖК Сонячний, корпус А"></div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Замовник</label>
          <input class="form-input" id="s-client" placeholder="назва компанії або ПІБ"></div>
        <div class="form-group"><label class="form-label">Адреса об'єкта</label>
          <input class="form-input" id="s-address" placeholder="вул., місто"></div>
      </div>
      <div class="form-row3">
        <div class="form-group"><label class="form-label">Тип договору</label>
          <select class="form-input" id="s-contract-type">
            <option value="general">Генпідряд</option><option value="sub">Субпідряд</option>
            <option value="own">Власне будівництво</option><option value="design-build">Проект + Будівництво</option>
          </select></div>
        <div class="form-group"><label class="form-label">Статус</label>
          <select class="form-input" id="s-status">
            <option value="active">🟢 В роботі</option><option value="pause">🟡 Пауза</option>
            <option value="done">🔵 Завершено</option><option value="archive">⚫ Архів</option>
          </select></div>
        <div class="form-group"><label class="form-label">Стадія</label>
          <select class="form-input" id="s-stage">
            <option value="budget">Погодження бюджету</option><option value="signing">Підписання Угоди</option>
            <option value="prep">Підготовка</option><option value="found">Фундамент</option>
            <option value="structure">Каркас/Монтаж</option><option value="envelope">Огороджувальні</option>
            <option value="interior">Оздоблення</option><option value="finish">Здача</option>
          </select></div>
      </div>
      <div class="form-row3">
        <div class="form-group"><label class="form-label">Дата договору</label>
          <input class="form-input" type="date" id="s-contract-date"></div>
        <div class="form-group"><label class="form-label">Початок робіт</label>
          <input class="form-input" type="date" id="s-start-date"></div>
        <div class="form-group"><label class="form-label">Термін виконання робіт</label>
          <input class="form-input" type="date" id="s-deadline"></div>
      </div>
      <div class="form-row3">
        <div class="form-group"><label class="form-label">Сума з ПДВ, грн</label>
          <input class="form-input" type="number" id="s-amount-gross" placeholder="0" oninput="calcVat()"></div>
        <div class="form-group"><label class="form-label">Сума без ПДВ, грн</label>
          <input class="form-input" type="number" id="s-amount-net" placeholder="0" readonly style="opacity:.6"></div>
        <div class="form-group"><label class="form-label">ПДВ 20%, грн</label>
          <input class="form-input" type="number" id="s-vat" placeholder="0" readonly style="opacity:.6"></div>
      </div>
      <div class="form-group"><label class="form-label">Примітки</label>
        <textarea class="form-input" id="s-notes" rows="2" placeholder="додаткова інформація..."></textarea></div>
      <div class="section-divider">💰 Фінанси від замовника</div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Отримано аванс, грн</label>
          <input class="form-input" type="number" id="s-client-advance" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Отримано по актах, грн</label>
          <input class="form-input" type="number" id="s-client-acts" placeholder="0"></div>
      </div>
      <div class="section-divider">👷 ІТР на об'єкті</div>
      <div id="s-itr-list"></div>
      <button class="btn sm" style="margin-top:6px" onclick="addSiteITRRow()">+ Призначити ІТР</button>
      <div class="section-divider">🏢 Субпідрядники на об'єкті</div>
      <div id="s-sub-list"></div>
      <button class="btn sm" style="margin-top:6px" onclick="addSiteSubRow()">+ Додати субпідрядника</button>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('site')">Скасувати</button>
      <button class="btn primary" onclick="saveSite()">Зберегти</button>
    </div>
  </div>
</div>

<!-- ═══ MODAL: ІТР ═══ -->
<div class="modal-overlay" id="modal-itr">
  <div class="modal" style="width:580px">
    <div class="modal-head">
      <span class="modal-title" id="modal-itr-title">Новий ІТР</span>
      <button class="modal-close" onclick="closeITRAndReturn()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row2">
        <div class="form-group"><label class="form-label">ПІБ *</label>
          <input class="form-input" id="i-name" placeholder="Іванов Іван Іванович"></div>
        <div class="form-group"><label class="form-label">Посада</label>
          <select class="form-input" id="i-role">
            <option value="pm">Керівник проекту</option><option value="engineer">Інженер</option>
            <option value="site-manager">Виконроб</option><option value="estimator">Кошторисник</option>
            <option value="architect">Архітектор</option><option value="safety">Охорона праці</option>
            <option value="other">Інше</option>
          </select></div>
      </div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Телефон</label>
          <input class="form-input" id="i-phone" placeholder="+380..."></div>
        <div class="form-group"><label class="form-label">Email</label>
          <input class="form-input" id="i-email" placeholder="email@..."></div>
      </div>
      <div class="form-group"><label class="form-label">Умови відносин</label>
        <select class="form-input" id="i-contract-type" onchange="toggleITRContract()">
          <option value="salary">💰 Заробітна плата</option>
          <option value="brigade">👥 Бригадир з бригадою</option>
          <option value="profit">📊 % у прибутку</option>
        </select></div>
      <div id="i-contract-detail" style="margin-bottom:12px"></div>
      <div class="form-group"><label class="form-label">Примітки</label>
        <textarea class="form-input" id="i-notes" rows="2" placeholder="додаткова інформація..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeITRAndReturn()">Скасувати</button>
      <button class="btn primary" onclick="saveITR()">Зберегти</button>
    </div>
  </div>
</div>

<!-- ═══ MODAL: СУБПІДРЯДНИК ═══ -->
<div class="modal-overlay" id="modal-sub">
  <div class="modal" style="width:580px">
    <div class="modal-head">
      <span class="modal-title" id="modal-sub-title">Новий субпідрядник</span>
      <button class="modal-close" onclick="closeSubAndReturn()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Назва компанії *</label>
          <input class="form-input" id="b-name" placeholder="ТОВ Будпром"></div>
        <div class="form-group"><label class="form-label">ЄДРПОУ</label>
          <input class="form-input" id="b-edrpou" placeholder="12345678"></div>
      </div>
      <div class="form-row3">
        <div class="form-group"><label class="form-label">Контактна особа</label>
          <input class="form-input" id="b-contact" placeholder="ПІБ"></div>
        <div class="form-group"><label class="form-label">Телефон</label>
          <input class="form-input" id="b-phone" placeholder="+380..."></div>
        <div class="form-group"><label class="form-label">Email</label>
          <input class="form-input" id="b-email" placeholder="email@..."></div>
      </div>
      <div class="form-row2">
        <div class="form-group"><label class="form-label">Вид робіт</label>
          <input class="form-input" id="b-worktype" placeholder="напр. Монолітні роботи"></div>
        <div class="form-group"><label class="form-label">Юридична адреса</label>
          <input class="form-input" id="b-address" placeholder="вул., місто"></div>
      </div>
      <div class="form-group"><label class="form-label">Примітки</label>
        <textarea class="form-input" id="b-notes" rows="2" placeholder="додаткова інформація..."></textarea></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeSubAndReturn()">Скасувати</button>
      <button class="btn primary" onclick="saveSub()">Зберегти</button>
    </div>
  </div>
</div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────
const FB_URL='https://macc-d6e9b-default-rtdb.europe-west1.firebasedatabase.app';
let state={sites:[],itrs:[],subs:[],cashflows:[]};
let curPage='sites',curSiteId=null,curITRId=null,curSubId=null,curExecutorsTab='itr';
let cfFilters={type:'',form:'',category:'',site:'',tag:'',month:'',search:''};
let editingSiteId=null,editingITRId=null,editingSubId=null;
let _siteITR=[],_siteSubs=[],_afterITRSave=null,_afterSubSave=null,_saveTimer=null;

// ── UTILS ─────────────────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
const _fmtUA=new Intl.NumberFormat('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2});
function fmt(n){return _fmtUA.format(+n||0)+' ₴';}
function fmtN(n){return _fmtUA.format(+n||0);}
function fmtD(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('uk-UA');}catch(e){return d;}}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function daysLeft(d){if(!d)return null;return Math.round((new Date(d)-new Date())/86400000);}
function pct(num,den){if(!den)return'—';return(num/den*100).toFixed(1)+'%';}

const CF_FORM_LABEL={cash:'💵 Готівка',bank:'🏦 Рахунок'};
let editingCFId=null;

const CONTRACT_TYPE={general:'Генпідряд',sub:'Субпідряд',own:'Власне будівництво','design-build':'Проект+Буд'};
const CONTRACT_COLOR={general:'#f0b429',sub:'#38bdf8',own:'#4ade80','design-build':'#a974e6'};
const STAGE_LABEL={budget:'Погодження бюджету',signing:'Підписання Угоди',prep:'Підготовка',found:'Фундамент',structure:'Каркас',envelope:'Огороджувальні',interior:'Оздоблення',finish:'Здача'};
const STATUS_LABEL={active:'В роботі',pause:'Пауза',done:'Завершено',archive:'Архів'};
const STATUS_CLASS={active:'s-active',pause:'s-pause',done:'s-done',archive:'s-archive'};
const ITR_ROLE={pm:'Керівник проекту',engineer:'Інженер','site-manager':'Виконроб',estimator:'Кошторисник',architect:'Архітектор',safety:'Охорона праці',other:'Інше'};

function contractBadge(t){const c=CONTRACT_COLOR[t]||'#9aa3b2';return`<span class="ct-badge" style="color:${c};background:${c}18;border:1px solid ${c}44">${CONTRACT_TYPE[t]||t}</span>`;}
function statusBadge(s){return`<span class="status-badge ${STATUS_CLASS[s]||'s-active'}">${STATUS_LABEL[s]||s}</span>`;}
function deadlineBadge(d,status){
  if(!d||status==='done'||status==='archive')return'';
  const dl=daysLeft(d);
  if(dl<0)return`<span style="color:#f87171;font-size:10px;font-weight:700">❗${Math.abs(dl)}д</span>`;
  if(dl<=30)return`<span style="color:#fbbf24;font-size:10px;font-weight:700">⚠${dl}д</span>`;
  return`<span style="color:var(--text3);font-size:10px">${dl}д</span>`;
}
function row(label,value){return`<div><div style="font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:3px">${label}</div><div style="font-size:12px;color:var(--text)">${value}</div></div>`;}

// helper: compute site financials
function siteCalc(s){
  const cliAdv=+s.clientAdvance||0, cliActs=+s.clientActs||0;
  const received=cliAdv+cliActs;
  const subs=s.subContracts||[];
  const subContractTotal=subs.reduce((a,c)=>a+(+c.amountGross||0),0);
  const subAdv=subs.reduce((a,c)=>a+(+c.advance||0),0);
  const subActs=subs.reduce((a,c)=>a+(+c.closedByActs||0),0);
  const spent=subAdv+subActs;
  const gross=+s.amountGross||0;
  const balance=received-spent;
  const margin=gross?((gross-subContractTotal)/gross*100):0;
  return{cliAdv,cliActs,received,subContractTotal,subAdv,subActs,spent,gross,balance,margin};
}

// ── STORAGE ───────────────────────────────────────────────────────────────
function save(){
  localStorage.setItem('macc_state',JSON.stringify(state));
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{fetch(FB_URL+'/state.json',{method:'PUT',body:JSON.stringify(state)}).catch(()=>{});},800);
}
function load(){
  const local=localStorage.getItem('macc_state');
  if(local)try{state=JSON.parse(local);state.itrs=state.itrs||[];state.subs=state.subs||[];}catch(e){}
  fetch(FB_URL+'/state.json').then(r=>r.json()).then(d=>{
    if(d&&d.sites){state=d;state.itrs=state.itrs||[];state.subs=state.subs||[];state.cashflows=state.cashflows||[];state.cfCategories=state.cfCategories||[];localStorage.setItem('macc_state',JSON.stringify(state));}
    render();
  }).catch(()=>render());
}

// ── NAVIGATION ────────────────────────────────────────────────────────────
function navigate(page,id){
  curPage=page;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const navKey=({'site-detail':'sites','site-budget':'budgets','itr-detail':'executors','sub-detail':'executors'})[page]||page;
  const nb=document.getElementById('nav-'+navKey);if(nb)nb.classList.add('active');
  if(page==='site-detail'&&id)curSiteId=id;
  if(page==='site-budget'&&id)curSiteId=id;
  if(page==='itr-detail'&&id)curITRId=id;
  if(page==='sub-detail'&&id)curSubId=id;
  render();
}
function render(){
  const p=curPage;
  if(p==='sites')renderSites();
  else if(p==='site-detail')renderSiteDetail();
  else if(p==='site-budget')renderSiteBudget();
  else if(p==='budgets')renderBudgets();
  else if(p==='executors')renderExecutors();
  else if(p==='itr-detail')renderITRDetail();
  else if(p==='sub-detail')renderSubDetail();
  else if(p==='cashflow')renderCashflow();
  else renderComingSoon(p);
}
function renderComingSoon(page){
  const labels={dashboard:'Дашборд',economics:'Економіка',reports:'Звіти'};
  document.getElementById('main-content').innerHTML=`<div class="empty-state" style="margin-top:60px"><div style="font-size:48px;margin-bottom:16px">🚧</div><h3>${labels[page]||page}</h3><p>Розділ у розробці</p></div>`;
}

// ── CF MODAL ──────────────────────────────────────────────────────────────
function openCFModal(id,defaultType){
  editingCFId=id||null;
  const r=id?(state.cashflows||[]).find(x=>x.id===id):null;
  document.getElementById('modal-cf-title').textContent=id?'Редагувати транзакцію':'Нова транзакція';
  document.getElementById('cf-type').value=r?.type||defaultType||'income';
  document.getElementById('cf-form').value=r?.form||'bank';
  document.getElementById('cf-date').value=r?.date||new Date().toISOString().slice(0,10);
  document.getElementById('cf-amount').value=r?.amount||'';
  document.getElementById('cf-tag').value=r?.tag||'';
  document.getElementById('cf-notes').value=r?.notes||'';
  // sites
  const sitesSel=document.getElementById('cf-site');
  sitesSel.innerHTML='<option value="">— Без об\'єкта —</option>'+(state.sites||[]).map(s=>`<option value="${s.id}"${r?.siteId===s.id?' selected':''}>${esc(s.name)}</option>`).join('');
  // categories datalist
  const cats=[...new Set([...(state.cfCategories||[]),...(state.cashflows||[]).map(x=>x.category).filter(Boolean)])].sort();
  document.getElementById('cf-cat-list').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join('');
  document.getElementById('cf-category').value=r?.category||'';
  // counterparties datalist: subs + existing counterparties
  const subNames=(state.subs||[]).map(s=>s.name).filter(Boolean);
  const usedCP=[...new Set((state.cashflows||[]).map(x=>x.counterparty).filter(Boolean))];
  const allCP=[...new Set([...subNames,...usedCP])].sort();
  document.getElementById('cf-cp-list').innerHTML=allCP.map(c=>`<option value="${esc(c)}">`).join('');
  document.getElementById('cf-counterparty').value=r?.counterparty||'';
  document.getElementById('modal-cf').classList.add('open');
}
function saveCF(){
  if(!state.cashflows)state.cashflows=[];
  if(!state.cfCategories)state.cfCategories=[];
  const amount=+document.getElementById('cf-amount').value||0;
  const date=document.getElementById('cf-date').value;
  const category=document.getElementById('cf-category').value.trim();
  if(!date){alert('Введіть дату');return;}
  if(!amount){alert('Введіть суму');return;}
  // save new category
  if(category&&!state.cfCategories.includes(category))state.cfCategories.push(category);
  const data={
    id:editingCFId||uid(),
    type:document.getElementById('cf-type').value,
    form:document.getElementById('cf-form').value,
    date,amount,category,
    siteId:document.getElementById('cf-site').value,
    counterparty:document.getElementById('cf-counterparty').value.trim(),
    tag:document.getElementById('cf-tag').value.trim(),
    notes:document.getElementById('cf-notes').value.trim(),
  };
  if(editingCFId){const i=state.cashflows.findIndex(x=>x.id===editingCFId);if(i>=0)state.cashflows[i]=data;}
  else state.cashflows.push(data);
  save();closeModal('cf');renderCashflow();
}
function deleteCF(id){
  if(!confirm('Видалити цю транзакцію?'))return;
  state.cashflows=state.cashflows.filter(x=>x.id!==id);save();renderCashflow();
}
function manageCFCategories(){
  const cats=(state.cfCategories||[]).slice().sort();
  const list=cats.map((c,i)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;color:var(--text)">${esc(c)}</span><button class="btn sm" style="color:var(--red);border-color:var(--red)" onclick="deleteCFCat('${esc(c)}',this.closest('.cat-mgr'))">×</button></div>`).join('');
  const html=`<div class="cat-mgr" style="padding:16px;min-width:320px">
    <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em">⚙ Категорії грошових потоків</div>
    <div style="margin-bottom:12px">${list||'<div style="font-size:11px;color:var(--text3);padding:10px 0">Категорій ще немає</div>'}</div>
    <div style="display:flex;gap:8px">
      <input class="form-input" id="new-cat-input" placeholder="Нова категорія..." style="flex:1">
      <button class="btn primary sm" onclick="addCFCat()">+ Додати</button>
    </div>
    <div style="margin-top:12px;display:flex;justify-content:flex-end"><button class="btn sm" onclick="this.closest('.modal-overlay').classList.remove('open');renderCashflow()">Закрити</button></div>
  </div>`;
  // reuse modal-cf temporarily? No — use a simple inline dialog via alert replacement
  // Build a quick inline overlay
  let ov=document.getElementById('cat-mgr-overlay');
  if(!ov){ov=document.createElement('div');ov.id='cat-mgr-overlay';ov.className='modal-overlay';ov.style.zIndex=300;ov.innerHTML=`<div class="modal" style="width:400px"></div>`;document.body.appendChild(ov);}
  ov.querySelector('.modal').innerHTML=html;
  ov.classList.add('open');
}
function addCFCat(){
  const inp=document.getElementById('new-cat-input');
  const v=inp.value.trim();
  if(!v)return;
  if(!state.cfCategories)state.cfCategories=[];
  if(!state.cfCategories.includes(v))state.cfCategories.push(v);
  inp.value='';save();manageCFCategories();
}
function deleteCFCat(cat){
  state.cfCategories=(state.cfCategories||[]).filter(c=>c!==cat);
  save();manageCFCategories();
}

// ── SITES LIST ────────────────────────────────────────────────────────────
function renderSites(){
  const el=document.getElementById('main-content');
  const sites=state.sites||[];

  // Aggregate metrics
  let totGross=0,totCliAdv=0,totCliActs=0,totSubContract=0,totSpent=0;
  sites.forEach(s=>{
    const f=siteCalc(s);
    totGross+=f.gross; totCliAdv+=f.cliAdv; totCliActs+=f.cliActs;
    totSubContract+=f.subContractTotal; totSpent+=f.spent;
  });
  const totReceived=totCliAdv+totCliActs;
  const totCliRemain=totGross-totReceived;
  const totSubRemain=totSubContract-totSpent;
  const active=sites.filter(s=>s.status==='active').length;
  const overdue=sites.filter(s=>s.deadline&&s.status==='active'&&daysLeft(s.deadline)<0).length;

  const metrics=`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px">
      <div>
        <div class="metric-group-label">📥 Надходження від замовників</div>
        <div class="metrics" style="margin-bottom:0">

        <td class="mono r" style="color:var(--amber)">${f.spent?fmtN(f.spent):'—'}</td>

        <td class="r" style="font-size:10px;font-weight:700;color:${f.margin>=0?'var(--green)':'var(--red)'}">${f.gross?f.margin.toFixed(1)+'%':'—'}</td>

  el.innerHTML=`${metrics}
    <div class="card">
      <div class="card-head">
        <span class="card-title">🏗 Будівельні майданчики</span>
        <button class="btn primary" onclick="openSiteModal()">+ Новий майданчик</button>

        <table class="tbl">
          <thead><tr>
            <th>Об'єкт</th><th>Тип</th><th>Статус</th><th>Стадія</th>
            <th class="r">Сума договору</th>

            <th class="r">Витрати план</th>
            <th class="r">Витрачено</th>
            <th class="r">Залишок витрат</th>
            <th class="r">Баланс</th>
            <th class="r">Маржа</th>
            <th>Старт / Дедлайн</th>
            <th></th>
          </tr></thead>
          <tbody>${tbody}</tbody>
        </table>
      </div>
    </div>`;
}

  const sites=state.sites||[];
  let totG=0,totR=0,totSC=0,totSp=0;
  sites.forEach(s=>{const f=siteCalc(s);totG+=f.gross;totR+=f.received;totSC+=f.subContractTotal;totSp+=f.spent;});
  const totBal=totR-totSp;

  const metrics=`<div class="metrics" style="margin-bottom:14px">
    <div class="metric" style="--mc:var(--violet)"><div class="metric-label">Всього контракти</div><div class="metric-value" style="font-size:14px">${fmt(totG)}</div></div>
    <div class="metric" style="--mc:var(--green)"><div class="metric-label">Отримано від замовників</div><div class="metric-value" style="font-size:14px">${fmt(totR)}</div></div>
    <div class="metric" style="--mc:var(--red)"><div class="metric-label">Витрати план</div><div class="metric-value" style="font-size:14px">${fmt(totSC)}</div></div>
    <div class="metric" style="--mc:var(--amber)"><div class="metric-label">Витрачено</div><div class="metric-value" style="font-size:14px">${fmt(totSp)}</div></div>
    <div class="metric" style="--mc:${totBal>=0?'var(--green)':'var(--red)'}"><div class="metric-label">Загальний баланс</div><div class="metric-value" style="font-size:14px;color:${totBal>=0?'var(--green)':'var(--red)'}">${fmt(totBal)}</div></div>
  </div>`;

  let tbody='';
  if(!sites.length){
    tbody=`<tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text3)">Майданчиків ще немає</td></tr>`;
  } else {
    [...sites].sort((a,b)=>({active:0,pause:1,done:2,archive:3}[a.status]||0)-({active:0,pause:1,done:2,archive:3}[b.status]||0)).forEach(s=>{
      const f=siteCalc(s);
      const balColor=f.balance>=0?'var(--green)':'var(--red)';
      tbody+=`<tr onclick="navigate('site-budget','${s.id}')">
        <td><b style="color:var(--text)">${esc(s.name)}</b></td>
        <td>${statusBadge(s.status)}</td>
        <td class="mono r">${fmt(f.gross)}</td>
        <td class="mono r" style="color:var(--green)">${fmt(f.received)}</td>
        <td class="mono r" style="color:var(--red)">${fmt(f.subContractTotal)}</td>
        <td class="mono r" style="color:var(--amber)">${fmt(f.spent)}</td>
        <td class="mono r" style="font-weight:700;color:${balColor}">${fmt(f.balance)}</td>
        <td class="r" style="font-weight:700;color:${f.margin>=0?'var(--green)':'var(--red)'}">${f.gross?f.margin.toFixed(1)+'%':'—'}</td>
        <td><button class="btn sm" onclick="event.stopPropagation();navigate('site-budget','${s.id}')">📊 Бюджет</button></td>
      </tr>`;
    });
  }

  el.innerHTML=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <h2 style="font-size:17px;font-weight:700;color:var(--text)">📊 Бюджети об'єктів</h2>
  </div>
  ${metrics}
  <div class="card">
    <div class="card-head"><span class="card-title">Всі об'єкти — зведений бюджет</span></div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr>
        <th>Об'єкт</th><th>Статус</th>
        <th class="r">Контракт</th><th class="r">Отримано</th>
        <th class="r">Витрати план</th><th class="r">Витрачено</th>
        <th class="r">Баланс</th><th class="r">Маржа</th><th></th>
      </tr></thead>
      <tbody>${tbody}</tbody>
    </table></div>
  </div>`;
}

// ── SITE MODAL ────────────────────────────────────────────────────────────
function openSiteModal(id){
  editingSiteId=id||null;
  document.getElementById('modal-site-title').textContent=id?'Редагувати майданчик':'Новий майданчик';
  const s=id?(state.sites||[]).find(x=>x.id===id):null;
  document.getElementById('s-name').value=s?.name||'';
  document.getElementById('s-client').value=s?.client||'';
  document.getElementById('s-address').value=s?.address||'';
  document.getElementById('s-contract-type').value=s?.contractType||'general';
  document.getElementById('s-status').value=s?.status||'active';
  document.getElementById('s-stage').value=s?.stage||'prep';
  document.getElementById('s-contract-date').value=s?.contractDate||'';
  document.getElementById('s-start-date').value=s?.startDate||'';
  document.getElementById('s-deadline').value=s?.deadline||'';
  document.getElementById('s-amount-gross').value=s?.amountGross||'';
  document.getElementById('s-amount-net').value=s?.amountNet||'';
  document.getElementById('s-vat').value=s?.vat||'';
  document.getElementById('s-notes').value=s?.notes||'';
  document.getElementById('s-client-advance').value=s?.clientAdvance||'';
  document.getElementById('s-client-acts').value=s?.clientActs||'';
  _siteITR=JSON.parse(JSON.stringify(s?.itrAssignments||[]));
  _siteSubs=JSON.parse(JSON.stringify(s?.subContracts||[]));
  renderSiteITRList();renderSiteSubList();
  document.getElementById('modal-site').classList.add('open');
}
function calcVat(){
  const gross=+document.getElementById('s-amount-gross').value||0;
  const net=Math.round(gross/1.2*100)/100;
  document.getElementById('s-amount-net').value=net||'';
  document.getElementById('s-vat').value=Math.round((gross-net)*100)/100||'';
}
function renderSiteITRList(){
  const el=document.getElementById('s-itr-list');
  if(!_siteITR.length){el.innerHTML=`<div style="color:var(--text3);font-size:11px;padding:5px 0">ІТР не призначено</div>`;return;}
  const itrs=state.itrs||[];
  el.innerHTML=_siteITR.map((a,i)=>`
    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:7px;align-items:center">
      <select class="form-input" style="font-size:12px" onchange="if(this.value==='__new__'){openITRFromSite(${i})}else{_siteITR[${i}].itrId=this.value}">
        <option value="">— Оберіть ІТР —</option>
        ${itrs.map(p=>`<option value="${p.id}"${a.itrId===p.id?' selected':''}>${esc(p.name)} (${ITR_ROLE[p.role]||p.role})</option>`).join('')}
        <option value="__new__">➕ Новий ІТР...</option>
      </select>
      <input class="form-input" style="font-size:12px" placeholder="Роль на об'єкті" value="${esc(a.roleOnSite||'')}" oninput="_siteITR[${i}].roleOnSite=this.value">
      <button class="btn sm" style="color:var(--red);border-color:var(--red)" onclick="_siteITR.splice(${i},1);renderSiteITRList()">×</button>
    </div>`).join('');
}
function addSiteITRRow(){_siteITR.push({itrId:'',roleOnSite:''});renderSiteITRList();}
function openITRFromSite(i){
  _afterITRSave=(newId)=>{_siteITR[i].itrId=newId;document.getElementById('modal-site').classList.add('open');renderSiteITRList();};
  document.getElementById('modal-site').classList.remove('open');openITRModal();
}
function renderSiteSubList(){
  const el=document.getElementById('s-sub-list');
  if(!_siteSubs.length){el.innerHTML=`<div style="color:var(--text3);font-size:11px;padding:5px 0">Субпідрядників не призначено</div>`;return;}
  const subs=state.subs||[];
  el.innerHTML=_siteSubs.map((c,i)=>`
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:7px">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
        <select class="form-input" style="font-size:12px;flex:1" onchange="if(this.value==='__new__'){openSubFromSite(${i})}else{_siteSubs[${i}].subId=this.value}">
          <option value="">— Оберіть субпідрядника —</option>
          ${subs.map(b=>`<option value="${b.id}"${c.subId===b.id?' selected':''}>${esc(b.name)}${b.worktype?' — '+esc(b.worktype):''}</option>`).join('')}
          <option value="__new__">➕ Новий субпідрядник...</option>
        </select>
        <button class="btn sm" style="color:var(--red);border-color:var(--red);flex-shrink:0" onclick="_siteSubs.splice(${i},1);renderSiteSubList()">× Видалити</button>
      </div>
      <div class="form-row2" style="margin-bottom:7px">
        <div><label class="form-label">Вид робіт</label>
          <input class="form-input" style="font-size:12px" placeholder="конкретний вид робіт" value="${esc(c.workDesc||'')}" oninput="_siteSubs[${i}].workDesc=this.value"></div>
        <div><label class="form-label">Термін виконання</label>
          <input class="form-input" type="date" style="font-size:12px" value="${c.deadline||''}" onchange="_siteSubs[${i}].deadline=this.value"></div>
      </div>
      <div class="form-row3">
        <div><label class="form-label">Сума з ПДВ, грн</label>
          <input class="form-input" type="number" style="font-size:12px" placeholder="0" value="${c.amountGross||''}" oninput="_siteSubs[${i}].amountGross=+this.value"></div>
        <div><label class="form-label">Аванс, грн</label>
          <input class="form-input" type="number" style="font-size:12px" placeholder="0" value="${c.advance||''}" oninput="_siteSubs[${i}].advance=+this.value"></div>
        <div><label class="form-label">Закрито актами, грн</label>
          <input class="form-input" type="number" style="font-size:12px" placeholder="0" value="${c.closedByActs||''}" oninput="_siteSubs[${i}].closedByActs=+this.value"></div>
      </div>
    </div>`).join('');
}
function addSiteSubRow(){_siteSubs.push({subId:'',workDesc:'',amountGross:0,advance:0,closedByActs:0,deadline:''});renderSiteSubList();}
function openSubFromSite(i){
  _afterSubSave=(newId)=>{_siteSubs[i].subId=newId;document.getElementById('modal-site').classList.add('open');renderSiteSubList();};
  document.getElementById('modal-site').classList.remove('open');openSubModal();
}
function saveSite(){
  const name=document.getElementById('s-name').value.trim();
  if(!name){alert('Введіть назву об\'єкта');return;}
  const amountGross=+document.getElementById('s-amount-gross').value||0;
  const amountNet=Math.round(amountGross/1.2*100)/100;
  const vat=Math.round((amountGross-amountNet)*100)/100;
  const data={
    id:editingSiteId||uid(),name,
    client:document.getElementById('s-client').value.trim(),
    address:document.getElementById('s-address').value.trim(),
    contractType:document.getElementById('s-contract-type').value,
    status:document.getElementById('s-status').value,
    stage:document.getElementById('s-stage').value,
    contractDate:document.getElementById('s-contract-date').value,
    startDate:document.getElementById('s-start-date').value,
    deadline:document.getElementById('s-deadline').value,
    amountNet,vat,amountGross,
    notes:document.getElementById('s-notes').value.trim(),
    clientAdvance:+document.getElementById('s-client-advance').value||0,
    clientActs:+document.getElementById('s-client-acts').value||0,
    itrAssignments:_siteITR.filter(a=>a.itrId&&a.itrId!=='__new__'),
    subContracts:_siteSubs.filter(c=>c.subId&&c.subId!=='__new__'),
  };
  if(!state.sites)state.sites=[];
  if(editingSiteId){const i=state.sites.findIndex(x=>x.id===editingSiteId);if(i>=0)state.sites[i]={...state.sites[i],...data};}
  else state.sites.push(data);
  save();closeModal('site');
  if(editingSiteId&&curPage==='site-detail')renderSiteDetail();
  else if(editingSiteId&&curPage==='site-budget')renderSiteBudget();
  else renderSites();
}
function deleteSite(id){
  if(!confirm('Видалити цей майданчик?'))return;
  state.sites=state.sites.filter(s=>s.id!==id);save();navigate('sites');
}

// ── ITR MODAL ─────────────────────────────────────────────────────────────
function openITRModal(id){
  editingITRId=id||null;
  document.getElementById('modal-itr-title').textContent=id?'Редагувати ІТР':'Новий ІТР';
  const p=id?(state.itrs||[]).find(x=>x.id===id):null;
  document.getElementById('i-name').value=p?.name||'';
  document.getElementById('i-role').value=p?.role||'pm';
  document.getElementById('i-phone').value=p?.phone||'';
  document.getElementById('i-email').value=p?.email||'';
  document.getElementById('i-notes').value=p?.notes||'';
  document.getElementById('i-contract-type').value=p?.contractType||'salary';
  toggleITRContract();
  if(p?.contractType==='salary'&&document.getElementById('i-salary'))document.getElementById('i-salary').value=p?.salaryAmount||'';
  if(p?.contractType==='profit'&&document.getElementById('i-profit-pct'))document.getElementById('i-profit-pct').value=p?.profitPercent||'';
  document.getElementById('modal-itr').classList.add('open');
}
function toggleITRContract(){
  const t=document.getElementById('i-contract-type').value;
  const el=document.getElementById('i-contract-detail');
  if(t==='salary')el.innerHTML=`<div class="form-group"><label class="form-label">Розмір зарплати, грн/міс</label><input class="form-input" type="number" id="i-salary" placeholder="0"></div>`;
  else if(t==='profit')el.innerHTML=`<div class="form-group"><label class="form-label">% у прибутку</label><input class="form-input" type="number" id="i-profit-pct" placeholder="0" min="0" max="100" step="0.1"></div>`;
  else el.innerHTML='';
}
function saveITR(){
  if(!state.itrs)state.itrs=[];
  const name=document.getElementById('i-name').value.trim();
  if(!name){alert('Введіть ПІБ');return;}
  const ct=document.getElementById('i-contract-type').value;
  const data={
    id:editingITRId||uid(),name,
    role:document.getElementById('i-role').value,
    phone:document.getElementById('i-phone').value.trim(),
    email:document.getElementById('i-email').value.trim(),
    notes:document.getElementById('i-notes').value.trim(),
    contractType:ct,
    salaryAmount:document.getElementById('i-salary')?+document.getElementById('i-salary').value||0:0,
    profitPercent:document.getElementById('i-profit-pct')?+document.getElementById('i-profit-pct').value||0:0,
  };
  if(editingITRId){const i=state.itrs.findIndex(x=>x.id===editingITRId);if(i>=0)state.itrs[i]={...state.itrs[i],...data};}
  else state.itrs.push(data);
  save();closeModal('itr');
  if(_afterITRSave){_afterITRSave(data.id);_afterITRSave=null;}
  else if(editingITRId&&curPage==='itr-detail')renderITRDetail();
  else renderExecutors();
}
function closeITRAndReturn(){
  closeModal('itr');
  if(_afterITRSave){_afterITRSave=null;document.getElementById('modal-site').classList.add('open');}
}
function deleteITR(id){
  if(!confirm('Видалити цього співробітника?'))return;
  state.itrs=state.itrs.filter(x=>x.id!==id);save();curExecutorsTab='itr';navigate('executors');
}

// ── SUB MODAL ─────────────────────────────────────────────────────────────
function openSubModal(id){
  editingSubId=id||null;
  document.getElementById('modal-sub-title').textContent=id?'Редагувати субпідрядника':'Новий субпідрядник';
  const b=id?(state.subs||[]).find(x=>x.id===id):null;
  document.getElementById('b-name').value=b?.name||'';
  document.getElementById('b-edrpou').value=b?.edrpou||'';
  document.getElementById('b-contact').value=b?.contact||'';
  document.getElementById('b-phone').value=b?.phone||'';
  document.getElementById('b-email').value=b?.email||'';
  document.getElementById('b-worktype').value=b?.worktype||'';
  document.getElementById('b-address').value=b?.address||'';
  document.getElementById('b-notes').value=b?.notes||'';
  document.getElementById('modal-sub').classList.add('open');
}
function saveSub(){
  if(!state.subs)state.subs=[];
  const name=document.getElementById('b-name').value.trim();
  if(!name){alert('Введіть назву компанії');return;}
  const data={
    id:editingSubId||uid(),name,
    edrpou:document.getElementById('b-edrpou').value.trim(),
    contact:document.getElementById('b-contact').value.trim(),
    phone:document.getElementById('b-phone').value.trim(),
    email:document.getElementById('b-email').value.trim(),
    worktype:document.getElementById('b-worktype').value.trim(),
    address:document.getElementById('b-address').value.trim(),
    notes:document.getElementById('b-notes').value.trim(),
  };
  if(editingSubId){const i=state.subs.findIndex(x=>x.id===editingSubId);if(i>=0)state.subs[i]={...state.subs[i],...data};}
  else state.subs.push(data);
  save();closeModal('sub');
  if(_afterSubSave){_afterSubSave(data.id);_afterSubSave=null;}
  else if(editingSubId&&curPage==='sub-detail')renderSubDetail();
  else renderExecutors();
}
function closeSubAndReturn(){
  closeModal('sub');
  if(_afterSubSave){_afterSubSave=null;document.getElementById('modal-site').classList.add('open');}
}
function deleteSub(id){
  if(!confirm('Видалити цього субпідрядника?'))return;
  state.subs=state.subs.filter(x=>x.id!==id);save();curExecutorsTab='subs';navigate('executors');
}

function closeModal(name){document.getElementById('modal-'+name).classList.remove('open');}

// ── INIT ──────────────────────────────────────────────────────────────────
load();
</script>
</body>
</html>
