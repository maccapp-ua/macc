<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MACC — Management Accounting in a Construction Company</title>
<style>
:root{
  --bg:#0f1621;--bg2:#151d2b;--bg3:#1a2336;--card:#1e2a3a;--card2:#243044;
  --border:#2a3a52;--border2:#334d6e;
  --text:#e8edf5;--text2:#a0afc0;--text3:#5a7090;
  --accent:#f0b429;--as:#f0b42922;
  --green:#4ade80;--red:#f87171;--amber:#fbbf24;
  --blue:#38bdf8;--violet:#a974e6;
  --radius:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
.topbar{display:flex;align-items:center;height:52px;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;gap:0;position:sticky;top:0;z-index:100}
.logo{font-size:18px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-right:32px;white-space:nowrap}
.logo span{font-size:10px;font-weight:400;color:var(--text3);display:block;letter-spacing:.05em;margin-top:-2px}
.nav-item{padding:0 14px;height:52px;display:flex;align-items:center;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;transition:.15s}
.nav-item:hover{color:var(--text)}
.nav-item.active{color:var(--accent);border-bottom-color:var(--accent)}
.main{padding:24px 20px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-title{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.card-body{padding:16px}
.metrics{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;min-width:160px;flex:1;border-top:2px solid var(--mc,var(--accent))}
.metric-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.metric-value{font-size:22px;font-weight:700;color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius);font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);transition:.15s}
.btn:hover{color:var(--text);border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#0f1621;border-color:var(--accent)}
.btn.primary:hover{opacity:.9}
.btn.sm{padding:4px 10px;font-size:11px}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.04em}
.status-badge{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.04em}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.tbl td{padding:10px 10px;border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg3);color:var(--text);cursor:pointer}
.tbl .mono{font-family:monospace;font-size:12px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border2);border-radius:12px;width:600px;max-width:95vw;max-height:90vh;overflow-y:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-title{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.modal-close{background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;line-height:1}
.modal-close:hover{color:var(--text)}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.form-group{margin-bottom:14px}
.form-label{display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.form-input{width:100%;padding:9px 12px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:13px;outline:none}
.form-input:focus{border-color:var(--accent)}
.form-row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
select.form-input option{background:var(--bg3)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state h3{font-size:16px;color:var(--text2);margin-bottom:8px}
.empty-state p{font-size:13px;margin-bottom:20px}
.s-active{background:rgba(74,222,128,.12);color:#4ade80;border:1px solid rgba(74,222,128,.25)}
.s-pause{background:rgba(107,114,128,.12);color:#9ca3af;border:1px solid rgba(107,114,128,.25)}
.s-done{background:rgba(56,189,248,.12);color:#38bdf8;border:1px solid rgba(56,189,248,.25)}
.s-archive{background:rgba(90,112,144,.10);color:#5a7090;border:1px solid rgba(90,112,144,.2)}
.ct-badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:800;letter-spacing:.04em}
.subtab{padding:10px 18px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text3);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:.15s}
.subtab:hover{color:var(--text)}
.subtab.active{color:var(--accent);border-bottom-color:var(--accent)}
.person-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s}
.person-card:hover{border-color:var(--border2);background:var(--card2)}
</style>
</head>
<body>

<nav class="topbar">
  <div class="logo">MACC<span>Management Accounting · Construction</span></div>
  <button class="nav-item" onclick="navigate('dashboard')" id="nav-dashboard">Дашборд</button>
  <button class="nav-item active" onclick="navigate('sites')" id="nav-sites">Майданчики</button>
  <button class="nav-item" onclick="navigate('executors')" id="nav-executors">Виконавці</button>
  <button class="nav-item" onclick="navigate('economics')" id="nav-economics">Економіка</button>
  <button class="nav-item" onclick="navigate('cashflow')" id="nav-cashflow">Грошові потоки</button>
  <button class="nav-item" onclick="navigate('reports')" id="nav-reports">Звіти</button>
</nav>

<div class="main" id="main-content"></div>

<!-- MODAL: Майданчик -->
<div class="modal-overlay" id="modal-site">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modal-site-title">Новий майданчик</span>
      <button class="modal-close" onclick="closeModal('site')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Назва об'єкта *</label>
        <input class="form-input" id="s-name" placeholder="напр. ЖК Сонячний, корпус А">
      </div>
      <div class="form-row2">
        <div class="form-group">
          <label class="form-label">Замовник</label>
          <input class="form-input" id="s-client" placeholder="назва компанії або ПІБ">
        </div>
        <div class="form-group">
          <label class="form-label">Адреса об'єкта</label>
          <input class="form-input" id="s-address" placeholder="вул., місто">
        </div>
      </div>
      <div class="form-row3">
        <div class="form-group">
          <label class="form-label">Тип договору</label>
          <select class="form-input" id="s-contract-type">
            <option value="general">Генпідряд</option>
            <option value="sub">Субпідряд</option>
            <option value="own">Власне будівництво</option>
            <option value="design-build">Проект + Будівництво</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Статус</label>
          <select class="form-input" id="s-status">
            <option value="active">🟢 В роботі</option>
            <option value="pause">🟡 Пауза</option>
            <option value="done">🔵 Завершено</option>
            <option value="archive">⚫ Архів</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Стадія</label>
          <select class="form-input" id="s-stage">
            <option value="budget">Погодження бюджету</option>
            <option value="signing">Підписання Угоди</option>
            <option value="prep">Підготовка</option>
            <option value="found">Фундамент</option>
            <option value="structure">Каркас/Монтаж</option>
            <option value="envelope">Огороджувальні</option>
            <option value="interior">Оздоблення</option>
            <option value="finish">Здача</option>
          </select>
        </div>
      </div>
      <div class="form-row3">
        <div class="form-group">
          <label class="form-label">Дата договору</label>
          <input class="form-input" type="date" id="s-contract-date">
        </div>
        <div class="form-group">
          <label class="form-label">Початок робіт</label>
          <input class="form-input" type="date" id="s-start-date">
        </div>
        <div class="form-group">
          <label class="form-label">Термін виконання робіт</label>
          <input class="form-input" type="date" id="s-deadline">
        </div>
      </div>
      <div class="form-row3">
        <div class="form-group">
          <label class="form-label">Сума з ПДВ, грн</label>
          <input class="form-input" type="number" id="s-amount-gross" placeholder="0" oninput="calcVat()">
        </div>
        <div class="form-group">
          <label class="form-label">Сума без ПДВ, грн</label>
          <input class="form-input" type="number" id="s-amount-net" placeholder="0" readonly style="opacity:.6">
        </div>
        <div class="form-group">
          <label class="form-label">ПДВ 20%, грн</label>
          <input class="form-input" type="number" id="s-vat" placeholder="0" readonly style="opacity:.6">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Примітки</label>
        <textarea class="form-input" id="s-notes" rows="2" placeholder="додаткова інформація..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('site')">Скасувати</button>
      <button class="btn primary" onclick="saveSite()">Зберегти</button>
    </div>
  </div>
</div>

<!-- MODAL: ІТР -->
<div class="modal-overlay" id="modal-itr">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modal-itr-title">Новий ІТР</span>
      <button class="modal-close" onclick="closeModal('itr')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row2">
        <div class="form-group">
          <label class="form-label">ПІБ *</label>
          <input class="form-input" id="i-name" placeholder="Іванов Іван Іванович">
        </div>
        <div class="form-group">
          <label class="form-label">Посада</label>
          <select class="form-input" id="i-role">
            <option value="pm">Керівник проекту</option>
            <option value="engineer">Інженер</option>
            <option value="site-manager">Виконроб</option>
            <option value="estimator">Кошторисник</option>
            <option value="architect">Архітектор</option>
            <option value="safety">Охорона праці</option>
            <option value="other">Інше</option>
          </select>
        </div>
      </div>
      <div class="form-row2">
        <div class="form-group">
          <label class="form-label">Телефон</label>
          <input class="form-input" id="i-phone" placeholder="+380...">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" id="i-email" placeholder="email@...">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Умови відносин</label>
        <select class="form-input" id="i-contract-type" onchange="toggleITRContract()">
          <option value="salary">💰 Заробітна плата</option>
          <option value="brigade">👥 Бригадир з бригадою</option>
          <option value="profit">📊 % у прибутку</option>
        </select>
      </div>
      <div id="i-contract-detail" style="margin-bottom:14px"></div>
      <div class="form-group">
        <label class="form-label">Об'єкти та ролі</label>
        <div id="i-sites-list"></div>
        <button class="btn sm" style="margin-top:8px" onclick="addITRSiteRow()">+ Додати об'єкт</button>
      </div>
      <div class="form-group">
        <label class="form-label">Примітки</label>
        <textarea class="form-input" id="i-notes" rows="2" placeholder="додаткова інформація..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('itr')">Скасувати</button>
      <button class="btn primary" onclick="saveITR()">Зберегти</button>
    </div>
  </div>
</div>

<!-- MODAL: Субпідрядник -->
<div class="modal-overlay" id="modal-sub">
  <div class="modal" style="width:680px">
    <div class="modal-head">
      <span class="modal-title" id="modal-sub-title">Новий субпідрядник</span>
      <button class="modal-close" onclick="closeModal('sub')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row2">
        <div class="form-group">
          <label class="form-label">Назва компанії *</label>
          <input class="form-input" id="b-name" placeholder="ТОВ Будпром">
        </div>
        <div class="form-group">
          <label class="form-label">ЄДРПОУ</label>
          <input class="form-input" id="b-edrpou" placeholder="12345678">
        </div>
      </div>
      <div class="form-row3">
        <div class="form-group">
          <label class="form-label">Контактна особа</label>
          <input class="form-input" id="b-contact" placeholder="ПІБ">
        </div>
        <div class="form-group">
          <label class="form-label">Телефон</label>
          <input class="form-input" id="b-phone" placeholder="+380...">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" id="b-email" placeholder="email@...">
        </div>
      </div>
      <div class="form-row2">
        <div class="form-group">
          <label class="form-label">Вид робіт</label>
          <input class="form-input" id="b-worktype" placeholder="напр. Монолітні роботи">
        </div>
        <div class="form-group">
          <label class="form-label">Юридична адреса</label>
          <input class="form-input" id="b-address" placeholder="вул., місто">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Договори по об'єктах</label>
        <div id="b-contracts-list"></div>
        <button class="btn sm" style="margin-top:8px" onclick="addSubContractRow()">+ Додати об'єкт</button>
      </div>
      <div class="form-group">
        <label class="form-label">Примітки</label>
        <textarea class="form-input" id="b-notes" rows="2" placeholder="додаткова інформація..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('sub')">Скасувати</button>
      <button class="btn primary" onclick="saveSub()">Зберегти</button>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
const FB_URL='https://macc-d6e9b-default-rtdb.europe-west1.firebasedatabase.app';
let state={sites:[],itrs:[],subs:[]};
let curPage='sites';
let curSiteId=null;
let curITRId=null;
let curSubId=null;
let curExecutorsTab='itr';
let editingSiteId=null;
let editingITRId=null;
let editingSubId=null;
let _itrSites=[];
let _subContracts=[];
let _saveTimer=null;

// ── UTILS ──────────────────────────────────────────────────────────────────
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
const _fmtUA=new Intl.NumberFormat('uk-UA',{minimumFractionDigits:2,maximumFractionDigits:2});
function fmt(n){return _fmtUA.format(+n||0)+' ₴';}
function fmtN(n){return _fmtUA.format(+n||0);}
function fmtD(d){if(!d)return'—';try{return new Date(d).toLocaleDateString('uk-UA');}catch(e){return d;}}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function daysLeft(d){if(!d)return null;return Math.round((new Date(d)-new Date())/86400000);}

const CONTRACT_TYPE={general:'Генпідряд',sub:'Субпідряд',own:'Власне будівництво','design-build':'Проект+Буд'};
const CONTRACT_COLOR={general:'#f0b429',sub:'#38bdf8',own:'#4ade80','design-build':'#a974e6'};
const STAGE_LABEL={budget:'Погодження бюджету',signing:'Підписання Угоди',prep:'Підготовка',found:'Фундамент',structure:'Каркас',envelope:'Огороджувальні',interior:'Оздоблення',finish:'Здача'};
const STATUS_LABEL={active:'В роботі',pause:'Пауза',done:'Завершено',archive:'Архів'};
const STATUS_CLASS={active:'s-active',pause:'s-pause',done:'s-done',archive:'s-archive'};
const ITR_ROLE={pm:'Керівник проекту',engineer:'Інженер','site-manager':'Виконроб',estimator:'Кошторисник',architect:'Архітектор',safety:'Охорона праці',other:'Інше'};
const ITR_ROLE_COLOR={pm:'#f0b429',engineer:'#38bdf8','site-manager':'#4ade80',estimator:'#a974e6',architect:'#fb923c',safety:'#f87171',other:'#9ca3af'};

function contractBadge(t){
  const c=CONTRACT_COLOR[t]||'#9aa3b2';
  return`<span class="ct-badge" style="color:${c};background:${c}18;border:1px solid ${c}44">${CONTRACT_TYPE[t]||t}</span>`;
}
function statusBadge(s){
  return`<span class="status-badge ${STATUS_CLASS[s]||'s-active'}">${STATUS_LABEL[s]||s}</span>`;
}
function deadlineBadge(d,status){
  if(!d||status==='done'||status==='archive')return'';
  const dl=daysLeft(d);
  if(dl<0)return`<span style="color:#f87171;font-size:10px;font-weight:700">❗ прострочено ${Math.abs(dl)}д</span>`;
  if(dl<=30)return`<span style="color:#fbbf24;font-size:10px;font-weight:700">⚠ ${dl}д</span>`;
  return`<span style="color:var(--text3);font-size:10px">${dl}д</span>`;
}
function row(label,value){
  return`<div><div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:4px">${label}</div><div style="font-size:13px;color:var(--text)">${value}</div></div>`;
}

// ── STORAGE ────────────────────────────────────────────────────────────────
function save(){
  localStorage.setItem('macc_state',JSON.stringify(state));
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    fetch(FB_URL+'/state.json',{method:'PUT',body:JSON.stringify(state)}).catch(()=>{});
  },800);
}
function load(){
  const local=localStorage.getItem('macc_state');
  if(local)try{state=JSON.parse(local);if(!state.itrs)state.itrs=[];if(!state.subs)state.subs=[];}catch(e){}
  fetch(FB_URL+'/state.json').then(r=>r.json()).then(d=>{
    if(d&&d.sites){state=d;if(!state.itrs)state.itrs=[];if(!state.subs)state.subs=[];localStorage.setItem('macc_state',JSON.stringify(state));}
    render();
  }).catch(()=>render());
}

// ── NAVIGATION ─────────────────────────────────────────────────────────────
function navigate(page,id){
  curPage=page;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const navKey=({'site-detail':'sites','itr-detail':'executors','sub-detail':'executors'})[page]||page;
  const nb=document.getElementById('nav-'+navKey);
  if(nb)nb.classList.add('active');
  if(page==='site-detail'&&id)curSiteId=id;
  if(page==='itr-detail'&&id)curITRId=id;
  if(page==='sub-detail'&&id)curSubId=id;
  render();
}
function render(){
  if(curPage==='sites')renderSites();
  else if(curPage==='site-detail')renderSiteDetail();
  else if(curPage==='executors')renderExecutors();
  else if(curPage==='itr-detail')renderITRDetail();
  else if(curPage==='sub-detail')renderSubDetail();
  else renderComingSoon(curPage);
}

// ── COMING SOON ────────────────────────────────────────────────────────────
function renderComingSoon(page){
  const labels={dashboard:'Дашборд',economics:'Економіка',cashflow:'Грошові потоки',reports:'Звіти'};
  document.getElementById('main-content').innerHTML=`
    <div class="empty-state" style="margin-top:60px">
      <div style="font-size:48px;margin-bottom:16px">🚧</div>
      <h3>${labels[page]||page}</h3>
      <p>Розділ у розробці — буде додано на наступному кроці</p>
    </div>`;
}

// ── SITES LIST ─────────────────────────────────────────────────────────────
function renderSites(){
  const el=document.getElementById('main-content');
  const sites=state.sites||[];
  const total=sites.length;
  const active=sites.filter(s=>s.status==='active').length;
  const totalGross=sites.reduce((a,s)=>a+(+s.amountGross||0),0);
  const overdue=sites.filter(s=>s.deadline&&s.status==='active'&&daysLeft(s.deadline)<0).length;

  const metrics=`<div class="metrics">
    <div class="metric" style="--mc:var(--accent)"><div class="metric-label">Всього об'єктів</div><div class="metric-value">${total}</div></div>
    <div class="metric" style="--mc:var(--green)"><div class="metric-label">В роботі</div><div class="metric-value">${active}</div></div>
    <div class="metric" style="--mc:var(--violet)"><div class="metric-label">Загальна сума з ПДВ</div><div class="metric-value" style="font-size:16px">${fmt(totalGross)}</div></div>
    ${overdue?`<div class="metric" style="--mc:var(--red)"><div class="metric-label">Прострочено дедлайн</div><div class="metric-value" style="color:var(--red)">${overdue}</div></div>`:''}
  </div>`;

  let tableBody='';
  if(!sites.length){
    tableBody=`<tr><td colspan="8" style="text-align:center;padding:60px;color:var(--text3)">
      <div style="font-size:32px;margin-bottom:12px">🏗</div>
      <div style="font-size:14px;color:var(--text2);margin-bottom:8px">Майданчиків ще немає</div>
      <div style="font-size:12px">Натисніть «+ Новий майданчик» щоб додати перший об'єкт</div>
    </td></tr>`;
  } else {
    const sorted=[...sites].sort((a,b)=>({active:0,pause:1,done:2,archive:3}[a.status]||0)-({active:0,pause:1,done:2,archive:3}[b.status]||0));
    sorted.forEach(s=>{
      tableBody+=`<tr onclick="navigate('site-detail','${s.id}')">
        <td><b style="color:var(--text)">${esc(s.name)}</b>${s.address?`<div style="font-size:10px;color:var(--text3);margin-top:2px">${esc(s.address)}</div>`:''}</td>
        <td>${s.client?esc(s.client):'—'}</td>
        <td>${contractBadge(s.contractType)}</td>
        <td>${statusBadge(s.status)}</td>
        <td style="color:var(--text3);font-size:11px">${STAGE_LABEL[s.stage]||'—'}</td>
        <td class="mono">${s.amountGross?fmtN(s.amountGross):'—'}</td>
        <td style="font-size:11px;color:var(--text3)">${fmtD(s.startDate)}<br>${fmtD(s.deadline)}</td>
        <td>${deadlineBadge(s.deadline,s.status)}</td>
      </tr>`;
    });
  }

  el.innerHTML=`${metrics}
    <div class="card">
      <div class="card-head">
        <span class="card-title">🏗 Будівельні майданчики</span>
        <button class="btn primary" onclick="openSiteModal()">+ Новий майданчик</button>
      </div>
      <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr>
            <th>Об'єкт</th><th>Замовник</th><th>Тип договору</th><th>Статус</th>
            <th>Стадія</th><th>Сума з ПДВ, грн</th><th>Старт / Дедлайн</th><th>Залишок</th>
          </tr></thead>
          <tbody>${tableBody}</tbody>
        </table>
      </div>
    </div>`;
}

    </div>

    <div class="metrics" style="margin-bottom:16px">
      <div class="metric" style="--mc:var(--violet)"><div class="metric-label">Договір з ПДВ</div><div class="metric-value" style="font-size:16px">${fmt(totG)}</div></div>
      <div class="metric" style="--mc:var(--amber)"><div class="metric-label">Аванс</div><div class="metric-value" style="font-size:16px">${fmt(totAdv)}</div></div>
      <div class="metric" style="--mc:var(--green)"><div class="metric-label">Закрито актами</div><div class="metric-value" style="font-size:16px">${fmt(totP)}</div></div>
      <div class="metric" style="--mc:${bal>0?'var(--red)':'var(--green)'}"><div class="metric-label">Залишок</div><div class="metric-value" style="font-size:16px;color:${bal>0?'var(--red)':'var(--green)'}">${fmt(bal)}</div></div>
    </div>

    <div style="display:grid;grid-template-columns:280px 1fr;gap:16px">
      <div class="card" style="margin-bottom:0;align-self:start">
        <div class="card-head"><span class="card-title">🏢 Реквізити</span></div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:14px">
          ${b.contact?row('Контактна особа',esc(b.contact)):''}
          ${b.phone?row('Телефон',`<a href="tel:${esc(b.phone)}" style="color:var(--blue)">${esc(b.phone)}</a>`):''}
          ${b.email?row('Email',`<a href="mailto:${esc(b.email)}" style="color:var(--blue)">${esc(b.email)}</a>`):''}
          ${b.address?row('Адреса',esc(b.address)):''}
          ${b.worktype?row('Вид робіт',esc(b.worktype)):''}
          ${b.notes?row('Примітки',esc(b.notes)):''}
        </div>
      </div>
      <div class="card" style="margin-bottom:0">
        <div class="card-head"><span class="card-title">📋 Договори по об'єктах (${contracts.length})</span></div>
        ${contracts.length?`<div style="overflow-x:auto"><table class="tbl">
          <thead><tr><th>Об'єкт</th><th>Вид робіт</th><th>Сума з ПДВ</th><th>Аванс</th><th>Закрито актами</th><th>Залишок</th><th>Дедлайн</th></tr></thead>
          <tbody>${contracts.map(c=>{
            const b2=(+c.amountGross||0)-(+c.advance||0)-(+c.closedByActs||0);
            return`<tr${c.siteId?` onclick="navigate('site-detail','${c.siteId}')"`:''}>
              <td style="color:var(--text);font-weight:600">${esc(c.siteName)}</td>
              <td style="font-size:11px;color:var(--text3)">${esc(c.workDesc||'—')}</td>
              <td class="mono">${c.amountGross?fmtN(c.amountGross):'—'}</td>
              <td class="mono" style="color:var(--amber)">${c.advance?fmtN(c.advance):'—'}</td>
              <td class="mono" style="color:var(--green)">${c.closedByActs?fmtN(c.closedByActs):'—'}</td>
              <td class="mono" style="font-weight:700;color:${b2>0?'var(--red)':'var(--green)'}">${c.amountGross?(b2>0?fmtN(b2):'✓'):'—'}</td>
              <td style="font-size:11px;color:var(--text3)">${fmtD(c.deadline)}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>`:`<div class="card-body" style="color:var(--text3);text-align:center;padding:40px">Договорів по об'єктах ще немає</div>`}
      </div>
    </div>`;
}

// ── SITE MODAL ─────────────────────────────────────────────────────────────
function openSiteModal(id){
  editingSiteId=id||null;
  document.getElementById('modal-site-title').textContent=id?'Редагувати майданчик':'Новий майданчик';
  const s=id?(state.sites||[]).find(x=>x.id===id):null;
  document.getElementById('s-name').value=s?.name||'';
  document.getElementById('s-client').value=s?.client||'';
  document.getElementById('s-address').value=s?.address||'';
  document.getElementById('s-contract-type').value=s?.contractType||'general';
  document.getElementById('s-status').value=s?.status||'active';
  document.getElementById('s-stage').value=s?.stage||'prep';
  document.getElementById('s-contract-date').value=s?.contractDate||'';
  document.getElementById('s-start-date').value=s?.startDate||'';
  document.getElementById('s-deadline').value=s?.deadline||'';
  document.getElementById('s-amount-gross').value=s?.amountGross||'';
  document.getElementById('s-amount-net').value=s?.amountNet||'';
  document.getElementById('s-vat').value=s?.vat||'';
  document.getElementById('s-notes').value=s?.notes||'';
  document.getElementById('modal-site').classList.add('open');
}
function calcVat(){
  const gross=+document.getElementById('s-amount-gross').value||0;
  const net=Math.round(gross/1.2*100)/100;
  const vat=Math.round((gross-net)*100)/100;
  document.getElementById('s-amount-net').value=net||'';
  document.getElementById('s-vat').value=vat||'';
}
function saveSite(){
  const name=document.getElementById('s-name').value.trim();
  if(!name){alert('Введіть назву об\'єкта');return;}
  const amountGross=+document.getElementById('s-amount-gross').value||0;
  const amountNet=Math.round(amountGross/1.2*100)/100;
  const vat=Math.round((amountGross-amountNet)*100)/100;
  const data={
    id:editingSiteId||uid(),name,
    client:document.getElementById('s-client').value.trim(),
    address:document.getElementById('s-address').value.trim(),
    contractType:document.getElementById('s-contract-type').value,
    status:document.getElementById('s-status').value,
    stage:document.getElementById('s-stage').value,
    contractDate:document.getElementById('s-contract-date').value,
    startDate:document.getElementById('s-start-date').value,
    deadline:document.getElementById('s-deadline').value,
    amountNet,vat,amountGross,
    notes:document.getElementById('s-notes').value.trim(),
  };
  if(!state.sites)state.sites=[];
  if(editingSiteId){const i=state.sites.findIndex(x=>x.id===editingSiteId);if(i>=0)state.sites[i]={...state.sites[i],...data};}
  else state.sites.push(data);
  save();closeModal('site');
  if(editingSiteId&&curPage==='site-detail')renderSiteDetail();else renderSites();
}
function deleteSite(id){
  if(!confirm('Видалити цей майданчик?'))return;
  state.sites=state.sites.filter(s=>s.id!==id);save();navigate('sites');
}

// ── ITR MODAL ──────────────────────────────────────────────────────────────
function openITRModal(id){
  editingITRId=id||null;
  document.getElementById('modal-itr-title').textContent=id?'Редагувати ІТР':'Новий ІТР';
  const p=id?(state.itrs||[]).find(x=>x.id===id):null;
  document.getElementById('i-name').value=p?.name||'';
  document.getElementById('i-role').value=p?.role||'pm';
  document.getElementById('i-phone').value=p?.phone||'';
  document.getElementById('i-email').value=p?.email||'';
  document.getElementById('i-notes').value=p?.notes||'';
  document.getElementById('i-contract-type').value=p?.contractType||'salary';
  toggleITRContract();
  if(p?.contractType==='salary')document.getElementById('i-salary').value=p?.salaryAmount||'';
  if(p?.contractType==='profit')document.getElementById('i-profit-pct').value=p?.profitPercent||'';
  _itrSites=JSON.parse(JSON.stringify(p?.sites||[]));
  renderITRSitesList();
  document.getElementById('modal-itr').classList.add('open');
}
function renderITRSitesList(){
  const el=document.getElementById('i-sites-list');
  const sites=state.sites||[];
  if(!_itrSites.length){
    el.innerHTML=`<div style="color:var(--text3);font-size:11px;padding:6px 0">Не прив'язаний до жодного об'єкта</div>`;return;
  }
  el.innerHTML=_itrSites.map((a,i)=>`
    <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center">
      <select class="form-input" style="font-size:12px" onchange="_itrSites[${i}].siteId=this.value">
        <option value="">— Оберіть об'єкт —</option>
        ${sites.map(s=>`<option value="${s.id}"${a.siteId===s.id?' selected':''}>${esc(s.name)}</option>`).join('')}
      </select>
      <input class="form-input" style="font-size:12px" placeholder="Роль на об'єкті (напр. ГІП)" value="${esc(a.roleOnSite||'')}" oninput="_itrSites[${i}].roleOnSite=this.value">
      <button class="btn sm" style="color:var(--red);border-color:var(--red)" onclick="_itrSites.splice(${i},1);renderITRSitesList()">×</button>
    </div>`).join('');
}
function addITRSiteRow(){_itrSites.push({siteId:'',roleOnSite:''});renderITRSitesList();}
function toggleITRContract(){
  const t=document.getElementById('i-contract-type').value;
  const el=document.getElementById('i-contract-detail');
  if(t==='salary')el.innerHTML=`<div class="form-group"><label class="form-label">Розмір зарплати, грн/міс</label><input class="form-input" type="number" id="i-salary" placeholder="0"></div>`;
  else if(t==='profit')el.innerHTML=`<div class="form-group"><label class="form-label">% у прибутку</label><input class="form-input" type="number" id="i-profit-pct" placeholder="0" min="0" max="100" step="0.1"></div>`;
  else el.innerHTML='';
}
function saveITR(){
  if(!state.itrs)state.itrs=[];
  const name=document.getElementById('i-name').value.trim();
  if(!name){alert('Введіть ПІБ');return;}
  const data={
    id:editingITRId||uid(),name,
    role:document.getElementById('i-role').value,
    phone:document.getElementById('i-phone').value.trim(),
    email:document.getElementById('i-email').value.trim(),
    notes:document.getElementById('i-notes').value.trim(),
    sites:_itrSites.filter(a=>a.siteId),
    contractType:document.getElementById('i-contract-type').value,
    salaryAmount:document.getElementById('i-salary')?+document.getElementById('i-salary').value||0:0,
    profitPercent:document.getElementById('i-profit-pct')?+document.getElementById('i-profit-pct').value||0:0,
  };
  if(editingITRId){const i=state.itrs.findIndex(x=>x.id===editingITRId);if(i>=0)state.itrs[i]={...state.itrs[i],...data};}
  else state.itrs.push(data);
  save();closeModal('itr');
  if(editingITRId&&curPage==='itr-detail')renderITRDetail();else renderExecutors();
}
function deleteITR(id){
  if(!confirm('Видалити цього співробітника?'))return;
  state.itrs=state.itrs.filter(x=>x.id!==id);save();curExecutorsTab='itr';navigate('executors');
}

// ── SUB MODAL ──────────────────────────────────────────────────────────────
function openSubModal(id){
  editingSubId=id||null;
  document.getElementById('modal-sub-title').textContent=id?'Редагувати субпідрядника':'Новий субпідрядник';
  const b=id?(state.subs||[]).find(x=>x.id===id):null;
  document.getElementById('b-name').value=b?.name||'';
  document.getElementById('b-edrpou').value=b?.edrpou||'';
  document.getElementById('b-contact').value=b?.contact||'';
  document.getElementById('b-phone').value=b?.phone||'';
  document.getElementById('b-email').value=b?.email||'';
  document.getElementById('b-worktype').value=b?.worktype||'';
  document.getElementById('b-address').value=b?.address||'';
  document.getElementById('b-notes').value=b?.notes||'';
  _subContracts=JSON.parse(JSON.stringify(b?.contracts||[]));
  renderSubContractsList();
  document.getElementById('modal-sub').classList.add('open');
}
function renderSubContractsList(){
  const el=document.getElementById('b-contracts-list');
  const sites=state.sites||[];
  if(!_subContracts.length){
    el.innerHTML=`<div style="color:var(--text3);font-size:11px;padding:6px 0">Договорів ще немає</div>`;return;
  }
  el.innerHTML=_subContracts.map((c,i)=>`
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
        <select class="form-input" style="font-size:12px;flex:1" onchange="_subContracts[${i}].siteId=this.value">
          <option value="">— Оберіть об'єкт —</option>
          ${sites.map(s=>`<option value="${s.id}"${c.siteId===s.id?' selected':''}>${esc(s.name)}</option>`).join('')}
        </select>
        <button class="btn sm" style="color:var(--red);border-color:var(--red);flex-shrink:0" onclick="_subContracts.splice(${i},1);renderSubContractsList()">× Видалити</button>
      </div>
      <div class="form-row2" style="margin-bottom:8px">
        <div><label class="form-label">Вид робіт</label>
          <input class="form-input" style="font-size:12px" placeholder="напр. Монолітні роботи" value="${esc(c.workDesc||'')}" oninput="_subContracts[${i}].workDesc=this.value"></div>
        <div><label class="form-label">Термін виконання</label>
          <input class="form-input" type="date" style="font-size:12px" value="${c.deadline||''}" onchange="_subContracts[${i}].deadline=this.value"></div>
      </div>
      <div class="form-row3">
        <div><label class="form-label">Сума з ПДВ, грн</label>
          <input class="form-input" type="number" style="font-size:12px" placeholder="0" value="${c.amountGross||''}" oninput="_subContracts[${i}].amountGross=+this.value"></div>
        <div><label class="form-label">Аванс, грн</label>
          <input class="form-input" type="number" style="font-size:12px" placeholder="0" value="${c.advance||''}" oninput="_subContracts[${i}].advance=+this.value"></div>
        <div><label class="form-label">Закрито актами, грн</label>
          <input class="form-input" type="number" style="font-size:12px" placeholder="0" value="${c.closedByActs||''}" oninput="_subContracts[${i}].closedByActs=+this.value"></div>
      </div>
    </div>`).join('');
}
function addSubContractRow(){_subContracts.push({siteId:'',workDesc:'',amountGross:0,advance:0,paid:0,deadline:''});renderSubContractsList();}
function saveSub(){
  if(!state.subs)state.subs=[];
  const name=document.getElementById('b-name').value.trim();
  if(!name){alert('Введіть назву компанії');return;}
  const data={
    id:editingSubId||uid(),name,
    edrpou:document.getElementById('b-edrpou').value.trim(),
    contact:document.getElementById('b-contact').value.trim(),
    phone:document.getElementById('b-phone').value.trim(),
    email:document.getElementById('b-email').value.trim(),
    worktype:document.getElementById('b-worktype').value.trim(),
    address:document.getElementById('b-address').value.trim(),
    notes:document.getElementById('b-notes').value.trim(),
    contracts:_subContracts.filter(c=>c.siteId||c.amountGross),
  };
  if(editingSubId){const i=state.subs.findIndex(x=>x.id===editingSubId);if(i>=0)state.subs[i]={...state.subs[i],...data};}
  else state.subs.push(data);
  save();closeModal('sub');
  if(editingSubId&&curPage==='sub-detail')renderSubDetail();else renderExecutors();
}
function deleteSub(id){
  if(!confirm('Видалити цього субпідрядника?'))return;
  state.subs=state.subs.filter(x=>x.id!==id);save();curExecutorsTab='subs';navigate('executors');
}

function closeModal(name){document.getElementById('modal-'+name).classList.remove('open');}

// ── INIT ───────────────────────────────────────────────────────────────────
load();
</script>
</body>
</html>
