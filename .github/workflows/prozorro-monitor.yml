on:
  schedule:
    # 07:00 UTC = 10:00 за київським часом (літо)
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run Prozorro monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python prozorro_monitor.py

      - name: Commit updated data
        run: |
          git config user.name  "prozorro-monitor-bot"
          git config user.email "bot@maccapp.ua"
          git add data/seen.json data/dzo_feed.json data/state.json
          if git diff --cached --quiet; then
            echo "Змін немає."
          else
            git commit -m "Prozorro feed update ($(date -u +%Y-%m-%d))"
            git push
          fi
